  renderPhoneUsageComparisonSVG(svgId, dates) {
    const W = 680, H = 220, padL = 44, padR = 20, padT = 20, padB = 36;
    const plotW = W - padL - padR, plotH = H - padT - padB;
    const phoneVals = dates.map(d => (this.state.phoneUsage || []).filter(p => p.date === d).reduce((a, p) => a + (p.mins || 0), 0));
    const studyVals = dates.map(d => Math.round(this.state.focusSessions.filter(f => f.date === d && f.kind === 'Study').reduce((a, f) => a + f.secs, 0) / 60));
    const maxVal = Math.max(120, ...phoneVals, ...studyVals);
    const step = plotW / Math.max(1, dates.length);
    const barW = Math.max(6, Math.min(18, step * 0.35));

    // 120m recommended daily phone limit line
    const limitY = padT + plotH - (120 / maxVal) * plotH;

    return `
      <svg id="${svgId}" viewBox="0 0 ${W} ${H}" class="w-full h-56">
        ${[0, 0.5, 1].map(f => {
          const y = padT + plotH * (1 - f);
          return `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="var(--border-color)" stroke-dasharray="3 3"/><text x="${padL - 6}" y="${y + 4}" text-anchor="end" fill="var(--text-muted)" font-size="10">${Math.round(maxVal * f)}m</text>`;
        }).join('')}
        <line x1="${padL}" y1="${limitY}" x2="${W - padR}" y2="${limitY}" stroke="#8b5cf6" stroke-dasharray="4 4" stroke-width="1.5" />
        <text x="${W - padR - 4}" y="${limitY - 5}" text-anchor="end" fill="#8b5cf6" font-size="9">120m Target Cap</text>
        ${dates.map((d, i) => {
          const gx = padL + i * step + step * 0.15;
          const pH = (phoneVals[i] / maxVal) * plotH;
          const sH = (studyVals[i] / maxVal) * plotH;
          return `
            <g class="cursor-pointer" onclick="app.inspectDateRecords('${d}')">
              <rect x="${gx}" y="${padT + plotH - pH}" width="${barW}" height="${Math.max(2, pH)}" rx="3" fill="#f43f5e"><title>${d} Phone Screen Time: ${phoneVals[i]}m</title></rect>
              <rect x="${gx + barW + 2}" y="${padT + plotH - sH}" width="${barW}" height="${Math.max(2, sH)}" rx="3" fill="#6366f1"><title>${d} Actual Study Focus: ${studyVals[i]}m</title></rect>
              <text x="${gx + barW}" y="${H - 12}" text-anchor="middle" fill="var(--text-muted)" font-size="9">${d.slice(5)}</text>
            </g>
          `;
        }).join('')}
      </svg>
    `;
  }

  renderPlannedVsActualSVG(svgId, dates) {
    const W = 520, H = 200, padL = 42, padB = 30, plotH = 145;
    const planned = dates.map(d => this.getOccurrencesOnDate(d).reduce((a, t) => a + (Number(t.dur) || 0), 0));
    const actual = dates.map(d => Math.round(this.state.focusSessions.filter(f => f.date === d && f.kind === 'Study').reduce((a, f) => a + f.secs, 0) / 60));
    const maxV = Math.max(60, ...planned, ...actual);
    const step = (W - padL - 20) / Math.max(1, dates.length);

    return `
      <svg id="${svgId}" viewBox="0 0 ${W} ${H}" class="w-full h-52">
        ${dates.map((d, i) => {
          const x = padL + i * step + 10;
          const pH = (planned[i] / maxV) * plotH;
          const aH = (actual[i] / maxV) * plotH;
          return `
            <g class="cursor-pointer" onclick="app.inspectDateRecords('${d}')">
              <rect x="${x}" y="${20 + plotH - pH}" width="14" height="${Math.max(2, pH)}" rx="3" fill="#475569"><title>${d} Planned Scheduled: ${planned[i]}m</title></rect>
              <rect x="${x + 16}" y="${20 + plotH - aH}" width="14" height="${Math.max(2, aH)}" rx="3" fill="#10b981"><title>${d} Actual Focus Logged: ${actual[i]}m</title></rect>
              <text x="${x + 15}" y="${H - 8}" text-anchor="middle" fill="var(--text-muted)" font-size="9">${d.slice(5)}</text>
            </g>
          `;
        }).join('')}
      </svg>
      <div class="flex justify-center gap-6 text-xs text-[var(--text-muted)]">
        <span class="flex items-center gap-1.5"><i class="w-2.5 h-2.5 rounded-sm bg-slate-600 inline-block"></i> Scheduled / Planned Time</span>
        <span class="flex items-center gap-1.5"><i class="w-2.5 h-2.5 rounded-sm bg-emerald-500 inline-block"></i> Actual Recorded Focus</span>
      </div>
    `;
  }

  // ==================== 6.4 BACKLOG ANALYTICS DASHBOARD ====================

    // Calculate daily average focus hours to project recovery timeline
    const last14 = this.getLastNDates(14);
    const avgDailyStudyHours = Math.max(0.5, this.state.focusSessions.filter(f => last14.includes(f.date) && f.kind === 'Study').reduce((a, f) => a + f.secs, 0) / 3600 / 14);

          </div>
          <div class="custom-card p-5 rounded-2xl">
            <div class="text-xs font-semibold text-[var(--text-muted)]">RECOVERY VELOCITY</div>
            <div class="text-2xl font-bold mt-2 text-emerald-400">${estDaysToClearLectures} days</div>
            <div class="text-xs text-[var(--text-muted)] mt-1">To clear lecture backlog at current pace</div>
          </div>
          <div class="custom-card p-5 rounded-2xl">
            <div class="text-xs font-semibold text-[var(--text-muted)]">OVERDUE TASKS</div>

          </div>
        </div>

        <div class="custom-card p-6 rounded-2xl">
          ${this.chartHeaderControls('svg-backlog-subj', 'Subject-Wise Backlog Comparison (Pending Lecture Mins & Pending Chapters)', 'Click any subject bar to open Backlog Manager')}
          <svg id="svg-backlog-subj" viewBox="0 0 560 210" class="w-full h-52">
            ${subjects.map((s, i) => {
              const pL = pendingLecs.filter(l => l.sid === s.id);
              const mins = pL.reduce((a, l) => a + (l.dur || 0), 0);
              const pC = pendingChaps.filter(c => c.sid === s.id).length;
              const y = 20 + i * 44;
              const w = Math.min(340, (mins / Math.max(60, ...subjects.map(x => pendingLecs.filter(l => l.sid === x.id).reduce((a, l) => a + (l.dur || 0), 0)))) * 340);
              return `
                <g class="cursor-pointer" onclick="app.setSubTab('Study','Backlog');app.navigate('Study')">
                  <text x="10" y="${y + 16}" fill="var(--text-main)" font-size="12" font-weight="600">${esc(s.name)}</text>
                  <rect x="135" y="${y}" width="${Math.max(4, w)}" height="22" rx="4" fill="${s.color || '#8b5cf6'}" />
                  <text x="${145 + w}" y="${y + 15}" fill="var(--text-muted)" font-size="11">${pL.length} lecs (${mins}m) · ${pC} chaps pending</text>
                </g>
              `;
            }).join('')}

  // ==================== 6.5 CREATIVE ANALYTICS DASHBOARD ====================
  renderAnalyticsCreative() {
    const mediums = this.getCreativeMediums();

      const mins = this.state.creativePractice.filter(cp => cp.medium === m).reduce((a, cp) => a + (cp.min || 0), 0);

      const palette = ['#6366f1', '#10b981', '#8b5cf6', '#ec4899', '#06b6d4', '#8b5cf6'];
      return { medium: m, mins, arts, color: palette[idx % palette.length] };
    });

    return `
      <div class="space-y-6">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <div class="custom-card p-6 rounded-2xl">
            ${this.chartHeaderControls('svg-crea-donut', 'User-Defined Medium Practice Distribution', 'Practice minutes recorded per creative medium')}
            ${this.renderDonutChartSVG('svg-crea-donut', medStats.map(m => ({ label: m.medium, value: m.mins, color: m.color })), `${medStats.reduce((a,m)=>a+m.mins,0)}m Total`)}

          <div class="custom-card p-6 rounded-2xl">
            ${this.chartHeaderControls('svg-crea-portfolio', 'Artwork Status & Portfolio Breakdown', 'Distribution across Idea, Planned, In Progress, and Completed')}
            ${this.renderDonutChartSVG('svg-crea-portfolio', [
              { label: 'Completed', value: this.state.artworks.filter(a=>a.status==='Completed').length, color: '#10b981' },
              { label: 'In Progress', value: this.state.artworks.filter(a=>a.status==='In Progress').length, color: '#6366f1' },

  renderAnalyticsHistoricalReports() {
    return `
      <div class="space-y-6">
        ${this.renderProgressReviews()}
        ${this.renderProgressReports()}

  closeModal() {
    const root = document.getElementById('modal-root');
    if (root) {
      root.classList.add('hidden');
      root.classList.remove('flex');
    }
  }

  submitArtwork(e) {
    e.preventDefault();
    const fd = new FormData(e.target);
    this.state.artworks.unshift({
      id: 'art_' + Math.random().toString(36).slice(2, 9),
      title: fd.get('title').trim(),
      medium: fd.get('medium'),
      status: fd.get('status'),
      date: new Date().toISOString().slice(0, 10),
      dims: fd.get('dims').trim(),
      imgId: null,
      imgType: '',
      tags: fd.get('tags').trim(),
      desc: fd.get('desc').trim(),
      notes: ''
    });
    this.saveState();
    this.closeModal();
    this.renderContent();
    this.hydrateCreativeImages();
    this.toast('Artwork added!', 'success');
  }

  async uploadArtworkFile(artId, e) {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const fileId = await saveFileToIDB(file);
      const art = this.state.artworks.find(a => a.id === artId);
      if (art) {
        art.imgId = fileId;
        art.imgType = file.type;
        this.saveState();
        this.hydrateCreativeImages();
        this.toast('High-res reference stored safely in IndexedDB!', 'success');
      }
    } catch (err) {
      this.toast('Failed to store file: ' + err.message, 'error');
    }
  }

  // ==================== 5. PROJECTS MODULE (PROJECT & RESEARCH MANAGEMENT) ====================
  getProjectProgress(p) {
    if (p.method === 'milestones') {
      const ms = this.state.milestones.filter(m => m.pid === p.id);
      const done = ms.filter(m => m.done).length;
      return { done, total: ms.length, pct: ms.length ? Math.round((done / ms.length) * 100) : 0, pctStr: ms.length ? Math.round((done / ms.length) * 100) + '%' : 'No data yet', label: `${done}/${ms.length} milestones` };
    }
    const ts = this.state.projectTasks.filter(t => t.pid === p.id);
    const done = ts.filter(t => t.status === 'Completed').length;
    return { done, total: ts.length, pct: ts.length ? Math.round((done / ts.length) * 100) : 0, pctStr: ts.length ? Math.round((done / ts.length) * 100) + '%' : 'No data yet', label: `${done}/${ts.length} tasks` };
  }

    this.state.selectedProjectId = pid;

            </select>
            <button type="submit" class="px-4 py-2 bg-indigo-600 text-white text-sm font-semibold rounded-xl">+ Create Project</button>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          ${this.state.projects.map(p => {

                    <span class="text-xs text-[var(--text-muted)]">Method: ${esc(p.method || 'tasks')}</span>
                  </div>
                  <h3 class="font-bold text-lg mt-2">${esc(p.name)}</h3>

                  <div class="w-full bg-[var(--bg-main)] h-2 rounded-full overflow-hidden">
                    <div class="bg-indigo-500 h-full rounded-full transition-all" style="width: ${prog.pct}%"></div>

                `).join('')}
            </div>
          </div>

  toggleProjectMethod(pid, method) {
    const p = this.state.projects.find(x => x.id === pid);
    if (p) { p.method = method; this.saveState(); this.renderContent(); }
  }

  addProjectTask(e, pid) {
    e.preventDefault();
    const fd = new FormData(e.target);
    this.state.projectTasks.push({ id: 'pt_' + Math.random().toString(36).slice(2,9), pid, title: fd.get('title').trim(), status: 'Pending', due: fd.get('due'), doneAt: '' });
    this.saveState();
    this.renderContent();
  }

  cycleProjectTaskStatus(id) {
    const pt = this.state.projectTasks.find(x => x.id === id);
    if (!pt) return;
    const order = ['Pending', 'In Progress', 'Completed'];
    pt.status = order[(order.indexOf(pt.status) + 1) % 3];
    pt.doneAt = pt.status === 'Completed' ? new Date().toISOString().slice(0, 10) : '';
    this.saveState();
    this.renderContent();
  }

  addProjectMilestone(e, pid) {
    e.preventDefault();
    const fd = new FormData(e.target);
    this.state.milestones.push({ id: 'ms_' + Math.random().toString(36).slice(2,9), pid, name: fd.get('name').trim(), target: fd.get('target'), done: false, doneAt: '' });
    this.saveState();
    this.renderContent();
  }

  toggleMilestone(id) {
    const m = this.state.milestones.find(x => x.id === id);
    if (m) { m.done = !m.done; m.doneAt = m.done ? new Date().toISOString().slice(0,10) : ''; this.saveState(); this.renderContent(); }
  }

  saveProjectNotes(pid, val) {
    const p = this.state.projects.find(x => x.id === pid);
    if (p) { p.notes = val; this.saveState(); this.toast('Project notes saved.', 'info'); }
  }

  addProjectLink(e, pid) {
    e.preventDefault();
    const fd = new FormData(e.target);
    this.state.projectLinks.push({ id: 'pl_' + Math.random().toString(36).slice(2,9), pid, title: fd.get('title').trim(), url: fd.get('url').trim() });
    this.saveState();
    this.renderContent();
  }

  addProject(e) {
    e.preventDefault();
    const fd = new FormData(e.target);
    this.state.projects.push({
      id: 'proj_' + Math.random().toString(36).slice(2, 9),
      name: fd.get('name').trim(),
      status: 'Active',
      cat: 'Research',
      pri: 'High',
      start: new Date().toISOString().slice(0, 10),
      target: '',
      desc: '',
      method: fd.get('method') || 'tasks',
      notes: ''
    });
    this.saveState();
    this.renderContent();
    this.toast('Project created!', 'success');
  }

              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;

  addReviewRecord(e) {
    e.preventDefault();
    const fd = new FormData(e.target);
    const todayStr = new Date().toISOString().slice(0, 10);
    const occs = this.getOccurrencesOnDate(todayStr);
    const doneCount = occs.filter(t => this.isTaskDoneOnDate(t, todayStr)).length;
    const studyMins = Math.round(this.state.focusSessions.filter(f => f.date === todayStr && f.kind === 'Study').reduce((a, f) => a + f.secs, 0) / 60);
    this.state.reviews.unshift({
      id: 'rev_' + Math.random().toString(36).slice(2, 9),
      kind: fd.get('kind'),
      date: todayStr,
      completedTasks: doneCount,
      pendingTasks: occs.length - doneCount,
      studyMins,
      wins: fd.get('wins').trim(),
      blockers: fd.get('blockers').trim(),
      nextPriorities: fd.get('nextPriorities').trim()
    });
    this.saveState();
    this.renderContent();
    this.toast('Historical review preserved!', 'success');
  }

  // ==================== 7. VECTOAI MODULE (PRIVATE LOCAL AI ASSISTANT) ====================
  getActiveThread() {
    let th = this.state.aiThreads.find(t => t.id === this.state.activeThreadId);
    if (!th) {
      th = this.state.aiThreads[0];
      if (th) this.state.activeThreadId = th.id;
    }
    return th;
  }

  buildAIContextString() {
    const P = this.state.permissions;
    const parts = [];
    const todayStr = new Date().toISOString().slice(0, 10);
    parts.push(`Today: ${todayStr}`);
    if (P.study) {
      const chaps = this.state.chapters.filter(c => !c.archived);
      const pendingLecs = this.state.lectures.filter(l => !l.done);
      const subs = this.state.subjects.filter(s => !s.archived);
      parts.push(`Subjects (${subs.length}): ${subs.map(s=>s.name).join(', ') || 'none'}`);
      parts.push(`Chapters: ${chaps.filter(c=>c.status==='Completed').length}/${chaps.length} done. List: ${chaps.slice(0,12).map(c=>`[${c.id}] ${c.name} (${c.status})`).join('; ') || 'none'}`);
      parts.push(`Pending lectures (${pendingLecs.length}): ${pendingLecs.slice(0,8).map(l=>l.title).join(', ') || 'none'}`);
      parts.push(`Exams: ${this.state.exams.map(e=>`${e.name} on ${e.date}`).join('; ') || 'none'}`);
    }
    if (P.planner) {
      const pendTasks = this.state.tasks.filter(t => !t.done);
      parts.push(`Pending tasks (${pendTasks.length}): ${pendTasks.slice(0,15).map(t=>`[${t.id}] ${t.title} on ${t.date||'any'} pri=${t.pri}`).join('; ') || 'none'}`);
      parts.push(`Goals: ${this.state.goals.filter(g=>!g.done).map(g=>g.title).join('; ') || 'none'}`);
      parts.push(`Habits: ${this.state.habits.map(h=>h.name).join('; ') || 'none'}`);
    }
    if (P.projects) {
      parts.push(`Projects: ${this.state.projects.map(p=>`${p.name} (${p.status})`).join(', ') || 'none'}`);
      parts.push(`Open milestones: ${this.state.milestones.filter(m=>!m.done).map(m=>m.name).join('; ') || 'none'}`);
    }
    if (P.creative) {
      parts.push(`Artworks: ${this.state.artworks.length}, Creative practice logs: ${this.state.creativePractice.length}`);
    }
    return parts.join(' | ') || 'Workspace is empty. User is starting fresh.';
  }

  createNewThread() {
    const id = 'thread_' + Math.random().toString(36).slice(2, 9);
    this.state.aiThreads.unshift({

      title: 'Conversation ' + (this.state.aiThreads.length + 1),

    });

    root.classList.remove('hidden');
    root.classList.add('flex');

  deleteThread(id) {

      this.state.activeThreadId = this.state.aiThreads[0]?.id || '';

  copyText(txt) {
    const ta = document.createElement('textarea');
    ta.value = txt;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    this.toast('Response copied to clipboard!', 'success');
  }

  quickPromptAI(q) {
    const inp = document.getElementById('ai-chat-input');
    if (inp) {
      inp.value = q;
      inp.form.requestSubmit();
    }
  }

  scrollToBottomChat() {
    const stream = document.getElementById('chat-stream');
    if (stream) stream.scrollTop = stream.scrollHeight;
  }

  isActionIntent(prompt) {
    const p = (prompt || '').toLowerCase();
    return /\b(add|create|schedule|set up|setup|make|plan|assign|insert|put|remind|todo|task|goal|habit|subject|chapter|project|lecture|complete|finish|mark)\b/.test(p);
  }

  extractProposalJson(txt) {
    if (!txt) return null;
    // Strip markdown fences if present
    let s = String(txt).trim();
    const fence = s.match(/```(?:json)?\s*([\s\S]*?)```/i);
    if (fence) s = fence[1].trim();
    const start = s.indexOf('{');
    const end = s.lastIndexOf('}');
    if (start < 0 || end <= start) return null;
    try {
      const parsed = JSON.parse(s.slice(start, end + 1));
      if (parsed && Array.isArray(parsed.ops) && parsed.ops.length) return parsed;
      // Single op object fallback
      if (parsed && parsed.op) return { title: parsed.title || 'Chat action', reason: parsed.reason || 'From chat', priority: 'High', ops: [parsed] };
    } catch (_) {}
    return null;
  }

  draftLocalOpsFromPrompt(goal) {
    const todayStr = new Date().toISOString().slice(0, 10);
    const g = (goal || '').trim();
    const low = g.toLowerCase();
    // Explicit task phrasing: "add task X", "create a task to X"
    let taskTitle = g;
    const m1 = g.match(/(?:add|create|make|schedule)\s+(?:a\s+)?(?:new\s+)?task(?:\s+to|\s+for)?\s*[:\-]?\s*(.+)/i);
    const m2 = g.match(/(?:remind me to|todo[:\s]+)\s*(.+)/i);
    if (m1) taskTitle = m1[1].trim();
    else if (m2) taskTitle = m2[1].trim();
    taskTitle = taskTitle.replace(/[.?!]+$/, '').slice(0, 160) || g.slice(0, 160);

    if (this.state.subjects.length === 0 && (low.includes('subject') || low.includes('setup') || low.includes('set up') || low.includes('start'))) {
      return {
        title: 'Setup workspace from chat',
        reason: 'Offline/local draft from your chat request.',
        priority: 'High',
        ops: [
          { op: 'addSubject', name: 'Physics', color: '#4169e1', priority: 'High', goal: 'Master core concepts' },
          { op: 'addSubject', name: 'Chemistry', color: '#8b5cf6', priority: 'High', goal: 'Finish syllabus' },
          { op: 'addSubject', name: 'Mathematics', color: '#6366f1', priority: 'High', goal: 'Daily practice' },
          { op: 'addTask', title: taskTitle || 'Plan this week study blocks', date: todayStr, start: '09:00', dur: 45, pri: 'High', cat: 'Study' }
        ]
      };
    }
    if (/\bhabit\b/.test(low)) {
      const hm = g.match(/habit(?:\s+called|\s+named)?\s*[:\-]?\s*(.+)/i);
      return { title: 'Add habit', reason: 'From chat request', priority: 'Medium', ops: [{ op: 'addHabit', name: (hm ? hm[1] : taskTitle).slice(0, 100) }] };
    }
    if (/\bgoal\b/.test(low)) {
      return { title: 'Add goal', reason: 'From chat request', priority: 'Medium', ops: [{ op: 'addGoal', title: taskTitle, horizon: 'Weekly' }] };
    }
    if (/\bproject\b/.test(low)) {
      return { title: 'Add project', reason: 'From chat request', priority: 'Medium', ops: [{ op: 'addProject', name: taskTitle, cat: 'Research', pri: 'High', desc: g }] };
    }
    if (/\bsubject\b/.test(low)) {
      const sm = g.match(/subject(?:\s+called|\s+named)?\s*[:\-]?\s*(.+)/i);
      return { title: 'Add subject', reason: 'From chat request', priority: 'High', ops: [{ op: 'addSubject', name: (sm ? sm[1] : taskTitle).slice(0, 80), color: '#4169e1', priority: 'High', goal: '' }] };
    }
    // Default: add task
    return {
      title: 'Add task from chat',
      reason: 'Drafted from your chat message. Approve to save.',
      priority: 'High',
      ops: [{ op: 'addTask', title: taskTitle, date: todayStr, start: '16:00', dur: 45, pri: 'High', cat: 'Study' }]
    };
  }

  enqueueProposal(parsed, source = 'chat') {
    if (!parsed || !Array.isArray(parsed.ops) || !parsed.ops.length) return null;
    const prop = {
      id: 'prop_' + Math.random().toString(36).slice(2, 9),
      title: String(parsed.title || 'Chat proposal').slice(0, 120),
      reason: String(parsed.reason || ('From ' + source)),
      priority: ['High','Medium','Low'].includes(parsed.priority) ? parsed.priority : 'High',
      ops: parsed.ops.slice(0, 10),
      editing: false,
      source
    };
    this.state.proposals.unshift(prop);
    this.saveState();
    return prop;
  }

  async sendChatMessage(e) {
    e.preventDefault();
    if (!this.isLocalhostEndpoint()) {
      this.toast('Security Block: VectoAI endpoint must remain on localhost (127.0.0.1).', 'error');
      return;
    }
    const fd = new FormData(e.target);
    const prompt = fd.get('prompt').trim();
    if (!prompt) return;

    const thread = this.getActiveThread();
    const nowTime = new Date().toTimeString().slice(0, 5);
    thread.messages.push({ id: 'm_' + Date.now(), role: 'user', time: nowTime, c: prompt });
    e.target.reset();
    this.setOrbState('thinking');
    this.renderContent();
    this.scrollToBottomChat();

    const wantsAction = this.isActionIntent(prompt);
    const todayStr = new Date().toISOString().slice(0, 10);

    try {
      const systemContent = wantsAction
        ? `You are VectoAI. User wants data changes. Reply with a short human explanation, THEN a JSON block. JSON schema ONLY:
{"title":string,"reason":string,"priority":"High|Medium|Low","ops":[{"op":"addTask","title":string,"date":"YYYY-MM-DD","start":"HH:MM","dur":number,"pri":"High|Medium|Low","cat":"Study|Revision|Practice|Personal"}|{"op":"addSubject","name":string,"color":"#4169e1","priority":"High|Medium|Low","goal":string}|{"op":"addGoal","title":string,"horizon":"Daily|Weekly|Monthly|Long-Term"}|{"op":"addHabit","name":string}|{"op":"addProject","name":string,"cat":string,"pri":"High|Medium|Low","desc":string}|{"op":"addChapter","subjectName":string,"name":string,"status":"Not started|In progress|Completed","priority":"High|Medium|Low","estHours":number}|{"op":"addLecture","subjectName":string,"title":string,"dur":number,"date":"YYYY-MM-DD"}|{"op":"completeTask","taskId":string}]}
Today is ${todayStr}. Never claim changes are already saved. Context: ${this.buildAIContextString()}`
        : `You are VectoAI, a private local personal OS assistant. You run fully offline. You may RECOMMEND plans. Never claim you already saved data. If user wants changes, tell them you can draft a proposal. Context: ${this.buildAIContextString()}`;

      const payload = {
        model: 'VectoAI',
        messages: [
          { role: 'system', content: systemContent },
          ...thread.messages.slice(-8).map(m => ({ role: m.role, content: m.c }))
        ],
        temperature: wantsAction ? 0.15 : 0.3
      };

      const res = await fetch(`${this.state.endpoint}/v1/chat/completions`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        signal: AbortSignal.timeout(90000),
        body: JSON.stringify(payload)
      });

      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      let reply = data.choices?.[0]?.message?.content || 'Empty response from model.';

      // If action intent, try to extract ops JSON from model reply and enqueue proposal
      let prop = null;
      if (wantsAction) {
        const parsed = this.extractProposalJson(reply);
        if (parsed) {
          prop = this.enqueueProposal(parsed, 'chat');
          reply += '\n\n✅ Drafted a proposal with ' + parsed.ops.length + ' operation(s). Open the Proposals tab and press Approve & Apply to save.';
        } else {
          // Model didn't return valid JSON — still create a local structured proposal from the user prompt
          prop = this.enqueueProposal(this.draftLocalOpsFromPrompt(prompt), 'chat-local');
          reply += '\n\n✅ I prepared a proposal from your request (model JSON missing). Open Proposals → Approve & Apply to add it.';
        }
      }

      thread.messages.push({ id: 'm_' + Date.now(), role: 'assistant', time: new Date().toTimeString().slice(0, 5), c: reply });
      this.setOrbState('connected');
      this.saveState();
      this.renderContent();
      this.scrollToBottomChat();
      if (prop) this.toast('Proposal ready — approve it in the Proposals tab.', 'success');
    } catch (err) {
      this.setOrbState('offline');
      let offlineMsg = `VectoAI is currently offline (${err.message}). Normal VectoPlan features remain 100% functional.`;
      if (wantsAction) {
        const prop = this.enqueueProposal(this.draftLocalOpsFromPrompt(prompt), 'chat-offline');
        offlineMsg += `\n\n✅ Offline proposal drafted with ${prop.ops.length} operation(s). Open Proposals → Approve & Apply to save your task/changes.`;
        this.toast('Offline proposal created — approve in Proposals tab.', 'info');
      } else {
        offlineMsg += ` When you start your local llama.cpp server at ${this.state.endpoint} with CORS enabled (--cors), you can continue chatting.`;
      }
      thread.messages.push({
        id: 'm_' + Date.now(),
        role: 'assistant',
        time: new Date().toTimeString().slice(0, 5),
        c: offlineMsg
      });
      this.saveState();
      this.renderContent();
      this.scrollToBottomChat();
    }
  }

  renderAIProposals() {
    return `
      <div class="space-y-6">
        <div class="custom-card p-4 rounded-2xl text-xs text-[var(--text-muted)] leading-relaxed">
          <b class="text-[var(--text-main)]">Permission-first control:</b> VectoAI can recommend and draft changes for tasks, subjects, chapters, goals, habits, projects, and lectures.

                    <button onclick="app.saveProposalEdit('${p.id}')" class="px-3 py-1.5 bg-indigo-600 text-white rounded-lg text-xs font-semibold">Save Edited Proposal</button>
                  </div>
                ` : ''}
                <div class="flex justify-end gap-2 pt-2">
                  <button onclick="app.toggleProposalEdit('${p.id}')" class="px-3.5 py-2 custom-card text-xs font-semibold rounded-xl">${p.editing ? 'Close Editor' : 'Edit Proposal'}</button>
                  <button onclick="app.rejectProposal('${p.id}')" class="px-3.5 py-2 custom-card text-xs font-semibold rounded-xl text-red-400">Reject</button>
                  <button onclick="app.approveProposal('${p.id}')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-xl">Approve & Apply</button>
                </div>
              </div>
            `).join('')}
        </div>
      </div>
    `;
  }

  async requestAIProposal(e) {
    e.preventDefault();
    const fd = new FormData(e.target);
    const goal = fd.get('goal').trim();
    if (!goal) return;
    const todayStr = new Date().toISOString().slice(0, 10);
    this.setOrbState('thinking');
    try {
      const res = await fetch(`${this.state.endpoint}/v1/chat/completions`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        signal: AbortSignal.timeout(45000),
        body: JSON.stringify({
          model: 'VectoAI',
          temperature: 0.2,
          messages: [
            { role: 'system', content: `You are VectoAI proposal engine. Reply with ONLY valid JSON (no markdown):
{"title":string,"reason":string,"priority":"High|Medium|Low","ops":[ ... ]}
Allowed ops (max 10):
- {"op":"addTask","title":string,"date":"YYYY-MM-DD","start":"HH:MM","dur":number,"pri":"High|Medium|Low","cat":"Study|Revision|Practice|Personal"}
- {"op":"addSubject","name":string,"color":"#hex","priority":"High|Medium|Low","goal":string}
- {"op":"addChapter","subjectName":string,"name":string,"status":"Not started|In progress|Completed","priority":"High|Medium|Low","estHours":number}
- {"op":"addGoal","title":string,"horizon":"Daily|Weekly|Monthly|Long-Term"}
- {"op":"addHabit","name":string}
- {"op":"addProject","name":string,"cat":string,"pri":"High|Medium|Low","desc":string}
- {"op":"addLecture","subjectName":string,"title":string,"dur":number,"date":"YYYY-MM-DD"}
- {"op":"completeTask","taskId":string}
Today is ${todayStr}. Only propose useful concrete ops. Context: ${this.buildAIContextString()}` },
            { role: 'user', content: goal }
          ]
        })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const txt = data.choices?.[0]?.message?.content || '';
      const parsed = this.extractProposalJson(txt);
      if (!parsed || !Array.isArray(parsed.ops) || !parsed.ops.length) throw new Error('Invalid proposal schema');
      this.enqueueProposal({
        title: parsed.title || ('Proposal: ' + goal.slice(0, 60)),
        reason: parsed.reason || 'Requested schedule optimization',
        priority: parsed.priority || 'High',
        ops: parsed.ops
      }, 'proposals-tab');
      this.setOrbState('connected');
      this.renderContent();
      this.toast('AI Proposal drafted! Review and approve below.', 'success');
    } catch (err) {
      this.setOrbState('offline');
      // Offline deterministic proposal so approval workflow stays usable without llama.cpp
      const g = goal.toLowerCase();
      let ops = [];
      if (this.state.subjects.length === 0 && (g.includes('subject') || g.includes('setup') || g.includes('start') || g.includes('plan'))) {
        ops = [
          { op: 'addSubject', name: 'Physics', color: '#4169e1', priority: 'High', goal: 'Master core concepts' },
          { op: 'addSubject', name: 'Chemistry', color: '#8b5cf6', priority: 'High', goal: 'Finish organic + inorganic' },
          { op: 'addSubject', name: 'Mathematics', color: '#6366f1', priority: 'High', goal: 'Daily problem practice' },
          { op: 'addGoal', title: 'Build consistent daily study habit', horizon: 'Weekly' },
          { op: 'addHabit', name: 'Morning deep work (90 min)' },
          { op: 'addTask', title: 'Plan this week study blocks', date: todayStr, start: '09:00', dur: 45, pri: 'High', cat: 'Study' }
        ];
      } else {
        const firstBacklog = this.state.lectures.find(l => !l.done);
        ops = [
          { op: 'addTask', title: firstBacklog ? `Complete Lecture: ${firstBacklog.title}` : goal.slice(0, 120), date: todayStr, start: '17:00', dur: 60, pri: 'High', cat: 'Study' }
        ];
      }
      this.state.proposals.unshift({
        id: 'prop_' + Math.random().toString(36).slice(2, 9),
        title: 'Local Proposal: ' + goal.slice(0, 60),
        reason: 'Offline structured draft for your review. Approve only if it matches what you want. Start local llama.cpp for smarter proposals.',
        priority: 'High',
        ops,
        editing: false
      });
      this.saveState();
      this.renderContent();
      this.toast('Drafted proposal for your review (offline mode).', 'info');
    }
  }

  toggleProposalEdit(id) {
    const p = this.state.proposals.find(x => x.id === id);
    if (p) { p.editing = !p.editing; this.renderContent(); }
  }

  saveProposalEdit(id) {
    const p = this.state.proposals.find(x => x.id === id);
    const el = document.getElementById('prop-edit-' + id);
    if (!p || !el) return;
    try {
      const ops = JSON.parse(el.value);
      if (!Array.isArray(ops)) throw new Error('Must be a JSON array of operations');
      p.ops = ops;
      p.editing = false;
      p.editedByUser = true;
      this.saveState();
      this.renderContent();
      this.toast('Proposal edits validated and saved!', 'success');
    } catch (e) {
      this.toast('Invalid JSON: ' + e.message, 'error');
    }
  }

  approveProposal(id) {
    const p = this.state.proposals.find(item => item.id === id);
    if (!p) return;
    const created = { tasks: [], subjects: [], chapters: [], goals: [], habits: [], projects: [], lectures: [] };
    const completedTaskIds = [];
    const findSubjectId = (name) => {
      if (!name) return '';
      const s = this.state.subjects.find(x => x.name.toLowerCase() === String(name).toLowerCase());
      return s ? s.id : '';
    };

    p.ops.forEach(o => {
      if (!o || !o.op) return;
      if (o.op === 'addTask' && (o.title || o.name)) {
        const tid = 'task_' + Math.random().toString(36).slice(2, 9);
        created.tasks.push(tid);
        this.state.tasks.push({
          id: tid,
          title: String(o.title || o.name).slice(0, 200),
          desc: 'Applied from approved VectoAI proposal',
          cat: o.cat || 'Study',
          date: o.date || new Date().toISOString().slice(0, 10),
          start: o.start || '16:00',
          dur: Number(o.dur) || 45,
          pri: ['High','Medium','Low'].includes(o.pri) ? o.pri : 'High',
          status: 'Pending',
          rep: 'none',
          done: false,
          doneOn: [],
          skip: [],
          depId: '',
          sid: findSubjectId(o.subjectName) || '',
          pid: '',
          goalId: '',
          ref: ''
        });
      } else if (o.op === 'addSubject' && o.name) {
        const sid = 'sub_' + Math.random().toString(36).slice(2, 9);
        created.subjects.push(sid);
        this.state.subjects.push({
          id: sid,
          name: String(o.name).slice(0, 80),
          color: o.color || '#4169e1',
          priority: ['High','Medium','Low'].includes(o.priority) ? o.priority : 'Medium',
          goal: String(o.goal || ''),
          archived: false,
          notes: ''
        });
      } else if (o.op === 'addChapter' && o.name) {
        const cid = 'chap_' + Math.random().toString(36).slice(2, 9);
        created.chapters.push(cid);
        this.state.chapters.push({
          id: cid,
          sid: findSubjectId(o.subjectName),
          name: String(o.name).slice(0, 120),
          desc: String(o.desc || ''),
          status: ['Not started','In progress','Completed'].includes(o.status) ? o.status : 'Not started',
          difficulty: o.difficulty || 'Medium',
          priority: ['High','Medium','Low'].includes(o.priority) ? o.priority : 'Medium',
          estHours: Number(o.estHours) || 8,
          revCount: 0,
          lastRev: '',
          next: '',
          confidence: 1,
          notes: '',
          targetDate: o.targetDate || '',
          archived: false
        });
      } else if (o.op === 'addGoal' && o.title) {
        const gid = 'goal_' + Math.random().toString(36).slice(2, 9);
        created.goals.push(gid);
        this.state.goals.push({
          id: gid,
          title: String(o.title).slice(0, 160),
          horizon: o.horizon || 'Weekly',
          cat: 'Academic',
          targetDate: o.targetDate || '',
          progress: 0,
          done: false,
          parentId: ''
        });
      } else if (o.op === 'addHabit' && o.name) {
        const hid = 'hab_' + Math.random().toString(36).slice(2, 9);
        created.habits.push(hid);
        this.state.habits.push({ id: hid, name: String(o.name).slice(0, 100), days: [] });
      } else if (o.op === 'addProject' && o.name) {
        const pid = 'proj_' + Math.random().toString(36).slice(2, 9);
        created.projects.push(pid);
        this.state.projects.push({
          id: pid,
          name: String(o.name).slice(0, 100),
          status: 'Active',
          cat: o.cat || 'Research',
          pri: ['High','Medium','Low'].includes(o.pri) ? o.pri : 'Medium',
          start: new Date().toISOString().slice(0, 10),
          target: o.target || '',
          desc: String(o.desc || ''),
          method: 'tasks',
          tags: '',
          notes: ''
        });
      } else if (o.op === 'addLecture' && o.title) {
        const lid = 'lec_' + Math.random().toString(36).slice(2, 9);
        created.lectures.push(lid);
        this.state.lectures.push({
          id: lid,
          sid: findSubjectId(o.subjectName),
          cid: '',
          title: String(o.title).slice(0, 160),
          dur: Number(o.dur) || 45,
          date: o.date || new Date().toISOString().slice(0, 10),
          done: false,
          doneAt: '',
          link: '',
          notes: ''
        });
      } else if (o.op === 'completeTask' && o.taskId) {
        const t = this.state.tasks.find(x => x.id === o.taskId);
        if (t && !t.done) {
          t.done = true;
          t.status = 'Completed';
          t.doneOn = t.doneOn || [];
          const d = new Date().toISOString().slice(0, 10);
          if (!t.doneOn.includes(d)) t.doneOn.push(d);
          completedTaskIds.push(t.id);
        }
      }
    });

    this.state.history.unshift({
      id: 'hist_' + Math.random().toString(36).slice(2, 9),
      at: Date.now(),
      title: p.title,
      decision: p.editedByUser ? 'Approved (Edited)' : 'Approved',
      opsCount: p.ops.length,
      createdTaskIds: created.tasks,
      createdIds: created,
      completedTaskIds,
      undone: false
    });
    this.state.proposals = this.state.proposals.filter(item => item.id !== id);
    this.saveState();
    this.renderContent();
    this.toast('Proposal approved — changes applied!', 'success');
  }

  undoApprovedHistory(histId) {
    const h = this.state.history.find(x => x.id === histId);
    if (!h || h.undone) return;
    const c = h.createdIds || { tasks: h.createdTaskIds || [] };
    if (c.tasks?.length) this.state.tasks = this.state.tasks.filter(t => !c.tasks.includes(t.id));
    if (c.subjects?.length) this.state.subjects = this.state.subjects.filter(s => !c.subjects.includes(s.id));
    if (c.chapters?.length) this.state.chapters = this.state.chapters.filter(ch => !c.chapters.includes(ch.id));
    if (c.goals?.length) this.state.goals = this.state.goals.filter(g => !c.goals.includes(g.id));
    if (c.habits?.length) this.state.habits = this.state.habits.filter(hb => !c.habits.includes(hb.id));
    if (c.projects?.length) this.state.projects = this.state.projects.filter(p => !c.projects.includes(p.id));
    if (c.lectures?.length) this.state.lectures = this.state.lectures.filter(l => !c.lectures.includes(l.id));
    // Re-open tasks that were completed by the proposal
    (h.completedTaskIds || []).forEach(id => {
      const t = this.state.tasks.find(x => x.id === id);
      if (t) { t.done = false; t.status = 'Pending'; }
    });
    h.undone = true;
    this.saveState();
    this.renderContent();
    this.toast('Approved AI action rolled back!', 'info');
  }

  rejectProposal(id) {
    const p = this.state.proposals.find(item => item.id === id);
    if (!p) return;
    this.state.history.unshift({
      id: 'hist_' + Math.random().toString(36).slice(2, 9),
      at: Date.now(),
      title: p.title,
      decision: 'Rejected',
      opsCount: p.ops.length,
      createdTaskIds: [],
      undone: false
    });
    this.state.proposals = this.state.proposals.filter(item => item.id !== id);
    this.saveState();
    this.renderContent();
    this.toast('Proposal rejected.', 'info');
  }

    return `
      <div class="custom-card rounded-2xl divide-y divide-[var(--border-color)]">
        ${this.state.history.length === 0 ? '<div class="p-8 text-center text-[var(--text-muted)]">No proposal decisions recorded yet.</div>' :
          this.state.history.map(h => `
            <div class="p-4 flex items-center justify-between gap-4">

                <span class="text-xs px-2.5 py-1 rounded-lg ${h.decision.startsWith('Approved') ? 'bg-emerald-500/10 text-emerald-400' : 'bg-red-500/10 text-red-400'} font-semibold">${esc(h.decision)}</span>
              </div>
            </div>

  }

  restoreFromTrash(tid) {
    const idx = this.state.trash.findIndex(t => t.tid === tid);
    if (idx < 0) return;
    const item = this.state.trash[idx];
    if (Array.isArray(this.state[item.coll])) {
      this.state[item.coll].push(item.record);
    }
    this.state.trash.splice(idx, 1);
    this.saveState();
    this.renderContent();
    this.toast('Record restored from Trash!', 'success');
  }

  purgeFromTrash(tid) {
    this.confirmAction('Permanently Delete Record', 'This record will be permanently purged and cannot be recovered.', () => {
      this.state.trash = this.state.trash.filter(t => t.tid !== tid);
      this.saveState();
      this.renderContent();
      this.toast('Permanently deleted.', 'info');
    });
  }

  setTheme(theme) {
    this.state.theme = theme;
    this.saveState();
    this.initTheme();
    this.toast('Theme updated!', 'success');
  }

  async saveEndpoint(e) {
    e.preventDefault();
    const fd = new FormData(e.target);
    const ep = fd.get('endpoint').trim().replace(/\/$/, '');
    this.state.endpoint = ep;
    this.saveState();
    const status = await this.pingAI();
    this.toast(status, 'info');
  }

  async createSnapshotBackup() {
    try {
      await saveBackupToIDB('Manual Snapshot', JSON.stringify(this.state));
      this.loadBackupsList();
      this.toast('Snapshot stored in IndexedDB!', 'success');
    } catch (e) {
      this.toast('Backup failed: ' + e.message, 'error');
    }
  }

  async loadBackupsList() {
    const container = document.getElementById('backups-list');
    if (!container) return;
    const list = await listBackupsFromIDB();
    container.innerHTML = list.length === 0
      ? '<div class="py-3 text-[var(--text-muted)]">No IndexedDB snapshots created yet. Click "+ Create Snapshot" above.</div>'
      : list.map(b => `
          <div class="py-2.5 flex items-center justify-between">
            <div>
              <span class="font-semibold">${esc(b.label)}</span>
              <span class="text-[var(--text-muted)] ml-2">${new Date(b.createdAt).toLocaleString()} · ${(b.size/1024).toFixed(1)} KB</span>
            </div>
            <div class="flex gap-2">
              <button onclick="app.restoreSnapshotBackup('${b.id}')" class="px-2.5 py-1 custom-card rounded-lg font-semibold">Restore</button>
              <button onclick="app.removeSnapshotBackup('${b.id}')" class="px-2.5 py-1 text-red-400">Delete</button>
            </div>
          </div>
        `).join('');
  }

  async restoreSnapshotBackup(id) {
    const list = await listBackupsFromIDB();
    const b = list.find(x => x.id === id);
    if (!b) return;
    this.confirmAction('Restore Snapshot', `Replace current data with snapshot "${b.label}" from ${new Date(b.createdAt).toLocaleString()}?`, async () => {
      await saveBackupToIDB('Auto-backup before restore', JSON.stringify(this.state));
      this.state = Object.assign({}, JSON.parse(JSON.stringify(DEFAULT_STATE)), JSON.parse(b.data));
      this.saveState();
      this.initTheme();
      this.renderContent();
      this.toast('Snapshot restored!', 'success');
    });
  }

  async removeSnapshotBackup(id) {
    await deleteBackupFromIDB(id);
    this.loadBackupsList();
  }

  exportJSON() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.state, null, 2));
    const dlAnchor = document.createElement('a');
    dlAnchor.setAttribute("href", dataStr);
    dlAnchor.setAttribute("download", `vectoplan_backup_${new Date().toISOString().slice(0,10)}.json`);
    document.body.appendChild(dlAnchor);
    dlAnchor.click();
    dlAnchor.remove();
    this.toast('Backup JSON exported!', 'success');
  }

  previewImportJSON(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const parsed = JSON.parse(event.target.result);
        if (!Array.isArray(parsed.subjects) || !Array.isArray(parsed.tasks)) {
          throw new Error('Invalid VectoPlan JSON schema');
        }
        this.confirmAction(
          'Import Preview & Confirmation',
          `This file contains ${parsed.subjects.length} subjects, ${parsed.chapters?.length || 0} chapters, ${parsed.tasks.length} tasks, and ${parsed.projects?.length || 0} projects. An automatic safety snapshot of your current data will be saved before importing.`,
          async () => {
            await saveBackupToIDB('Auto-backup before JSON import', JSON.stringify(this.state));
            this.state = Object.assign({}, JSON.parse(JSON.stringify(DEFAULT_STATE)), parsed);
            this.saveState();
            this.initTheme();
            this.renderContent();
            this.toast('JSON imported safely!', 'success');
          },
          'Approve & Import',
          false
        );
      } catch (err) {
        this.toast('Import validation failed: ' + err.message, 'error');
      }
    };
    reader.readAsText(file);
  }

  resetSystemData() {
    this.confirmAction(
      'Factory Reset VectoPlan',
      'This will reset all records to factory defaults. An automatic snapshot will be saved in IndexedDB first so you never lose work.',
      async () => {
        await saveBackupToIDB('Before Factory Reset', JSON.stringify(this.state));
        localStorage.removeItem(STORAGE_KEY);
        this.state = JSON.parse(JSON.stringify(DEFAULT_STATE));
        this.saveState();
        this.initTheme();
        this.renderContent();
        this.toast('System reset to factory defaults.', 'info');
      },
      'Reset Everything'
    );
  }
}

// Initialize Application on Window Load
let app;
window.onload = () => {
  app = new VectoPlanApp();
};
</script>
