<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VectoPlan — Next Generation Personal Operating System</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: ['class', '[data-theme="dark"]'],
  theme: {
    extend: {
      colors: {
        brand: {
          50: '#eef2ff',
          100: '#e0e7ff',
          500: '#6366f1',
          600: '#4f46e5',
          700: '#4338ca',
          900: '#312e81',
        }
      }
    }
  }
}
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&family=Orbitron:wght@600;700;800;900&display=swap');

  :root {
    --bg-main: #0a1628;
    --bg-card: rgba(15, 30, 60, 0.28);
    --bg-card-hover: rgba(25, 45, 90, 0.42);
    --border-color: rgba(100, 140, 255, 0.22);
    --text-main: #e8f0ff;
    --text-muted: #8ba3c7;
    --accent: #4169e1;
    --accent-hover: #5b7cfa;
    --hud-navy: #0a1628;
    --hud-royal: #4169e1;
    --hud-violet: #8b5cf6;
    --hud-amber: #8b5cf6;
    --hud-cyan: #4169e1;
    --hud-orange: #7c3aed;
    --hud-pink: #8b5cf6;
    --hud-lime: #6366f1;
    --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.35), inset 0 1px 0 0 rgba(65, 105, 225, 0.15);
    --card-hover-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), 0 0 30px rgba(65, 105, 225, 0.22), 0 0 18px rgba(139, 92, 246, 0.15), inset 0 1px 0 0 rgba(65, 105, 225, 0.25);
    --inset-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.35);
  }

  [data-theme="light"] {
    --bg-main: #e8eef8;
    --bg-card: rgba(255, 255, 255, 0.5);
    --bg-card-hover: rgba(255, 255, 255, 0.72);
    --border-color: rgba(65, 105, 225, 0.2);
    --text-main: #0f172a;
    --text-muted: #64748b;
    --accent: #4169e1;
    --accent-hover: #3451b2;
    --hud-navy: #1e3a5f;
    --hud-royal: #4169e1;
    --hud-violet: #7c3aed;
    --hud-amber: #7c3aed;
    --hud-cyan: #4169e1;
    --hud-orange: #6d28d9;
    --hud-pink: #7c3aed;
    --hud-lime: #4f46e5;
    --card-shadow: 0 8px 32px rgba(30, 58, 95, 0.12), inset 0 1px 0 0 rgba(255, 255, 255, 0.9);
    --card-hover-shadow: 0 12px 40px rgba(30, 58, 95, 0.18), 0 0 20px rgba(65, 105, 225, 0.12), inset 0 1px 0 0 rgba(255, 255, 255, 1);
    --inset-shadow: inset 2px 2px 8px rgba(30, 58, 95, 0.12), inset -2px -2px 8px rgba(255, 255, 255, 0.6);
  }

  body {
    background-color: var(--bg-main);
    background-image:
      radial-gradient(ellipse 80% 50% at 10% 15%, rgba(65, 105, 225, 0.22), transparent 50%),
      radial-gradient(ellipse 60% 40% at 90% 10%, rgba(139, 92, 246, 0.18), transparent 48%),
      radial-gradient(ellipse 70% 50% at 50% 95%, rgba(65, 105, 225, 0.14), transparent 50%),
      radial-gradient(ellipse 45% 35% at 75% 55%, rgba(124, 58, 237, 0.1), transparent 50%),
      linear-gradient(rgba(65, 105, 225, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(65, 105, 225, 0.04) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%, 44px 44px, 44px 44px;
    background-attachment: fixed;
    color: var(--text-main);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    overflow-x: hidden;
    animation: bgPulse 12s ease-in-out infinite alternate;
  }

  @keyframes bgPulse {
    0% {
      background-position: 0% 0%, 100% 0%, 50% 100%, 75% 55%, 0 0, 0 0;
    }
    100% {
      background-position: 12% 8%, 88% 6%, 48% 92%, 70% 58%, 0 0, 0 0;
    }
  }

  /* Cinematic scanline overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0, 0, 0, 0.035) 2px,
      rgba(0, 0, 0, 0.035) 4px
    );
    pointer-events: none;
    z-index: 9999;
    opacity: 0.35;
  }

  /* ========== FIXED HUD BACKGROUND DESIGN LAYER ========== */
  #hud-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  #hud-bg .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(139, 92, 246, 0.12);
  }
  #hud-bg .ring-cyan {
    border-color: rgba(65, 105, 225, 0.1);
  }
  #hud-bg .arc {
    position: absolute;
    border-radius: 50%;
    border: 2px solid transparent;
  }
  #hud-bg .corner {
    position: absolute;
    width: 48px;
    height: 48px;
    opacity: 0.35;
  }
  #hud-bg .corner::before,
  #hud-bg .corner::after {
    content: '';
    position: absolute;
    background: linear-gradient(90deg, var(--hud-amber), transparent);
  }
  #hud-bg .corner-tl { top: 18px; left: 18px; }
  #hud-bg .corner-tl::before { top: 0; left: 0; width: 48px; height: 2px; }
  #hud-bg .corner-tl::after { top: 0; left: 0; width: 2px; height: 48px; background: linear-gradient(180deg, var(--hud-amber), transparent); }

  #hud-bg .corner-tr { top: 18px; right: 18px; }
  #hud-bg .corner-tr::before { top: 0; right: 0; width: 48px; height: 2px; background: linear-gradient(270deg, var(--hud-cyan), transparent); }
  #hud-bg .corner-tr::after { top: 0; right: 0; width: 2px; height: 48px; background: linear-gradient(180deg, var(--hud-cyan), transparent); }

  #hud-bg .corner-bl { bottom: 18px; left: 18px; }
  #hud-bg .corner-bl::before { bottom: 0; left: 0; width: 48px; height: 2px; background: linear-gradient(90deg, var(--hud-cyan), transparent); }
  #hud-bg .corner-bl::after { bottom: 0; left: 0; width: 2px; height: 48px; background: linear-gradient(0deg, var(--hud-cyan), transparent); }

  #hud-bg .corner-br { bottom: 18px; right: 18px; }
  #hud-bg .corner-br::before { bottom: 0; right: 0; width: 48px; height: 2px; background: linear-gradient(270deg, var(--hud-amber), transparent); }
  #hud-bg .corner-br::after { bottom: 0; right: 0; width: 2px; height: 48px; background: linear-gradient(0deg, var(--hud-amber), transparent); }

  #hud-bg .orbit {
    position: absolute;
    border-radius: 50%;
    border: 1px dashed rgba(139, 92, 246, 0.08);
    animation: hudSpinCW 80s linear infinite;
  }
  #hud-bg .orbit-rev {
    animation: hudSpinCCW 60s linear infinite;
    border-color: rgba(65, 105, 225, 0.07);
  }
  #hud-bg .dot {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--hud-amber);
    box-shadow: 0 0 10px var(--hud-amber);
    opacity: 0.5;
  }
  #hud-bg .vline {
    position: absolute;
    width: 1px;
    background: linear-gradient(180deg, transparent, rgba(245,158,11,0.15), transparent);
  }
  #hud-bg .hline {
    position: absolute;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(34,211,238,0.12), transparent);
  }
  #hud-bg .hex {
    position: absolute;
    width: 80px;
    height: 90px;
    opacity: 0.06;
    background: linear-gradient(135deg, rgba(245,158,11,0.4), transparent);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  }

  .font-futuristic {
    font-family: 'Orbitron', 'JetBrains Mono', monospace;
  }

  /* Advanced Glassmorphism + Neon Card System */
  .custom-card {
    background: var(--bg-card);
    backdrop-filter: blur(32px) saturate(150%);
    -webkit-backdrop-filter: blur(32px) saturate(150%);
    border: 1px solid var(--border-color);
    box-shadow: var(--card-shadow);
    position: relative;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                border-color 0.35s ease,
                background 0.35s ease;
  }

  .custom-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(135deg, rgba(65, 105, 225, 0.45), transparent 40%, rgba(139, 92, 246, 0.3), transparent 70%, rgba(124, 58, 237, 0.25));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    opacity: 0.9;
    transition: opacity 0.35s ease;
  }

  .custom-card:hover {
    background: var(--bg-card-hover);
    border-color: rgba(65, 105, 225, 0.45);
    box-shadow: var(--card-hover-shadow);
    transform: translateY(-4px);
  }

  .custom-card:hover::before {
    opacity: 1;
  }

  /* Corner accent markers for tech panels */
  .custom-card::after {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 12px; height: 12px;
    border-top: 2px solid var(--hud-cyan);
    border-left: 2px solid var(--hud-cyan);
    border-radius: 2px 0 0 0;
    opacity: 0.6;
    pointer-events: none;
    transition: opacity 0.3s;
    box-shadow: -1px -1px 8px rgba(65, 105, 225, 0.45);
  }
  .custom-card:hover::after {
    opacity: 1;
  }

  /* Glass Inputs & Controls */
  input:not([type="checkbox"]):not([type="color"]), select, textarea {
    box-shadow: var(--inset-shadow);
    transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    background: rgba(255, 255, 255, 0.04) !important;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-color: rgba(255, 255, 255, 0.1) !important;
  }
  input:not([type="checkbox"]):not([type="color"]):focus, select:focus, textarea:focus {
    border-color: var(--hud-cyan) !important;
    background: rgba(65, 105, 225, 0.08) !important;
    box-shadow: var(--inset-shadow), 0 0 0 3px rgba(65, 105, 225, 0.22);
    transform: translateY(-1px);
  }

  button {
    transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  }
  button:active:not(:disabled) {
    transform: scale(0.96);
  }

  /* Primary action buttons get neon glow */
  .btn-neon {
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 22px rgba(65, 105, 225, 0.35);
  }
  .btn-neon:hover {
    box-shadow: 0 0 32px rgba(65, 105, 225, 0.55), 0 0 16px rgba(139, 92, 246, 0.3);
  }

  /* Floating neon particles for moving background */
  @keyframes floatParticle {
    0% { transform: translateY(0) translateX(0); opacity: 0.2; }
    25% { opacity: 0.7; }
    50% { transform: translateY(-40vh) translateX(20px); opacity: 0.5; }
    75% { opacity: 0.8; }
    100% { transform: translateY(-80vh) translateX(-15px); opacity: 0; }
  }
  #hud-bg .particle {
    position: absolute;
    bottom: -10px;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #4169e1;
    box-shadow: 0 0 8px #4169e1, 0 0 16px #4169e1;
    animation: floatParticle linear infinite;
    opacity: 0;
  }
  #hud-bg .particle.pink {
    background: #8b5cf6;
    box-shadow: 0 0 8px #8b5cf6, 0 0 16px #8b5cf6;
  }
  #hud-bg .particle.purple {
    background: #7c3aed;
    box-shadow: 0 0 8px #7c3aed, 0 0 16px #7c3aed;
  }

  /* ========== KEYFRAME ANIMATIONS ========== */
  @keyframes viewEnter {
    0% { opacity: 0; transform: translateY(18px) scale(0.98); filter: blur(6px); }
    100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }
  @keyframes hudSpinCW {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes hudSpinCCW {
    from { transform: rotate(360deg); }
    to { transform: rotate(0deg); }
  }
  @keyframes reactorPulse {
    0%, 100% { filter: drop-shadow(0 0 12px rgba(139, 92, 246, 0.55)); }
    50% { filter: drop-shadow(0 0 28px rgba(124, 58, 237, 0.95)); }
  }
  @keyframes eqWave {
    0%, 100% { transform: scaleY(0.22); opacity: 0.4; }
    50% { transform: scaleY(1); opacity: 1; }
  }
  @keyframes glowPulse {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }
  @keyframes borderShimmer {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }
  @keyframes softFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  @keyframes ringPulse {
    0% { transform: scale(0.92); opacity: 0.7; }
    70% { transform: scale(1.15); opacity: 0; }
    100% { transform: scale(1.15); opacity: 0; }
  }
  @keyframes scanLine {
    0% { transform: translateY(-100%); }
    100% { transform: translateY(100%); }
  }
  @keyframes dataStream {
    0% { opacity: 0.3; }
    50% { opacity: 1; }
    100% { opacity: 0.3; }
  }
  @keyframes coreBreathe {
    0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(139, 92, 246, 0.5); }
    50% { transform: scale(1.08); box-shadow: 0 0 40px rgba(124, 58, 237, 0.85); }
  }

  #app-content > div {
    animation: viewEnter 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  /* Stagger children slightly for polish */
  #app-content .custom-card {
    animation: viewEnter 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .hud-spin-slow {
    animation: hudSpinCW 28s linear infinite;
    transform-origin: center;
  }
  .hud-spin-rev {
    animation: hudSpinCCW 16s linear infinite;
    transform-origin: center;
  }
  .hud-spin-fast {
    animation: hudSpinCW 5s linear infinite;
    transform-origin: center;
  }
  .hud-reactor-glow {
    animation: reactorPulse 3.2s ease-in-out infinite;
  }
  .core-breathe {
    animation: coreBreathe 2.8s ease-in-out infinite;
  }
  .eq-bar {
    transform-origin: bottom;
    animation: eqWave 1.1s ease-in-out infinite;
  }
  .eq-bar:nth-child(2) { animation-delay: 0.1s; }
  .eq-bar:nth-child(3) { animation-delay: 0.22s; }
  .eq-bar:nth-child(4) { animation-delay: 0.05s; }
  .eq-bar:nth-child(5) { animation-delay: 0.18s; }
  .eq-bar:nth-child(6) { animation-delay: 0.3s; }
  .eq-bar:nth-child(7) { animation-delay: 0.12s; }
  .eq-bar:nth-child(8) { animation-delay: 0.25s; }

  /* Navigation active state glow */
  aside nav button {
    position: relative;
  }

  /* Custom scrollbars */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(65, 105, 225, 0.35); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(65, 105, 225, 0.65); }

  /* Focus timer specific HUD elements */
  .chrono-dial-wrap {
    position: relative;
    filter: drop-shadow(0 0 18px rgba(139, 92, 246, 0.25));
  }
  .chrono-progress-ring {
    transition: stroke-dashoffset 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .hud-tick-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    fill: rgba(148, 163, 184, 0.7);
  }

  /* Reduced motion support */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>

  <div class="particle purple" style="left:78%;animation-duration:15s;animation-delay:2.5s;"></div>
  <div class="particle pink" style="left:88%;animation-duration:11s;animation-delay:1.5s;"></div>
  <div class="particle" style="left:95%;animation-duration:13s;animation-delay:3.5s;"></div>

<!-- Toast Notification Container -->

  </div>
</button>

// IndexedDB Helper for Large Binary Files (Images / PDFs) & Snapshots
const dbPromise = new Promise((resolve, reject) => {
  if (!window.indexedDB) return reject(new Error('IndexedDB not supported'));
  const req = indexedDB.open('VectoPlanFilesDB', 2);
  req.onupgradeneeded = (e) => {
    const db = e.target.result;
    if (!db.objectStoreNames.contains('files')) db.createObjectStore('files', { keyPath: 'id' });
    if (!db.objectStoreNames.contains('backups')) db.createObjectStore('backups', { keyPath: 'id' });
  };
  req.onsuccess = (e) => resolve(e.target.result);
  req.onerror = (e) => reject(e.target.error);
});

async function saveFileToIDB(file) {
  if (file.size > 25 * 1024 * 1024) throw new Error('File exceeds 25 MB safety limit.');
  const db = await dbPromise;
  const id = 'file_' + Math.random().toString(36).slice(2, 9);
  const record = { id, blob: file, name: file.name, type: file.type, size: file.size, createdAt: Date.now() };
  await new Promise((res, rej) => {
    const tx = db.transaction('files', 'readwrite');
    tx.objectStore('files').put(record);
    tx.oncomplete = () => res(true);
    tx.onerror = () => rej(tx.error);
  });
  return id;
}

async function getFileFromIDB(id) {
  if (!id) return null;
  const db = await dbPromise;
  return new Promise((res) => {
    const tx = db.transaction('files', 'readonly');
    const req = tx.objectStore('files').get(id);
    req.onsuccess = () => res(req.result || null);
    req.onerror = () => res(null);
  });
}

async function saveBackupToIDB(label, rawData) {
  const db = await dbPromise;
  const id = 'bk_' + Math.random().toString(36).slice(2, 9);
  const rec = { id, label, createdAt: Date.now(), size: rawData.length, data: rawData };
  await new Promise((res, rej) => {
    const tx = db.transaction('backups', 'readwrite');
    tx.objectStore('backups').put(rec);
    tx.oncomplete = () => res(true);
    tx.onerror = () => rej(tx.error);
  });
  return rec;
}

async function listBackupsFromIDB() {
  const db = await dbPromise;
  return new Promise((res) => {
    const tx = db.transaction('backups', 'readonly');
    const req = tx.objectStore('backups').getAll();
    req.onsuccess = () => res((req.result || []).sort((a,b) => b.createdAt - a.createdAt));
    req.onerror = () => res([]);
  });
}

async function deleteBackupFromIDB(id) {
  const db = await dbPromise;
  return new Promise((res) => {
    const tx = db.transaction('backups', 'readwrite');
    tx.objectStore('backups').delete(id);
    tx.oncomplete = () => res(true);
  });
}

// Single-page PDF Generator for Artwork Export (Preserves Aspect Ratio, Never Splits)
function createSinglePageImagePDF(jpgBytes, width, height) {
  const pageW = 595;
  const pageH = Math.max(200, Math.min(14000, Math.round(595 * (height / width))));
  const enc = new TextEncoder();
  const chunks = [];
  const offsets = [];
  let length = 0;
  const push = (data) => {
    const bytes = typeof data === 'string' ? enc.encode(data) : data;
    chunks.push(bytes);
    length += bytes.length;
  };
  push('%PDF-1.4\n');
  const writeObj = (num, fn) => {
    offsets[num] = length;
    push(num + ' 0 obj\n');
    fn();
    push('\nendobj\n');
  };
  writeObj(1, () => push('<< /Type /Catalog /Pages 2 0 R >>'));
  writeObj(2, () => push('<< /Type /Pages /Kids [3 0 R] /Count 1 >>'));
  writeObj(3, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`));
  writeObj(4, () => {
    push(`<< /Type /XObject /Subtype /Image /Width ${width} /Height ${height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpgBytes.length} >>\nstream\n`);
    push(jpgBytes);
    push('\nendstream');
  });
  const streamCmd = `q ${pageW} 0 0 ${pageH} 0 0 cm /Im0 Do Q`;
  writeObj(5, () => push(`<< /Length ${streamCmd.length} >>\nstream\n${streamCmd}\nendstream`));
  const xrefPos = length;
  push('xref\n0 6\n0000000000 65535 f \n');
  for (let i = 1; i <= 5; i++) push(String(offsets[i]).padStart(10, '0') + ' 00000 n \n');
  push(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF`);
  return new Blob(chunks, { type: 'application/pdf' });
}

// HTML Escape Helper
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Main Application Controller
class VectoPlanApp {
  constructor() {
    this.state = this.loadState();
    this.timerInterval = null;
    this.focusRuntime = this.loadFocusRuntime();
    this.calendarDate = new Date().toISOString().slice(0, 10);
    this.calendarMonthOffset = 0;
    this.studyFilter = { q: '', sid: '', status: '' };
    this.taskFilter = { q: '', pri: '', status: '', cat: '' };
    this.creativeFilter = { q: '', medium: '', status: '', sort: 'new' };
    this.progressRange = 'All';
    this.analyticsFilter = {
      period: '30d',
      from: new Date(Date.now() - 29 * 86400000).toISOString().slice(0, 10),
      to: new Date().toISOString().slice(0, 10),
      compare: false,
      subjectId: '',
      projectId: '',
      category: ''
    };
    this.aiStatus = 'offline';
    this.initTheme();
    this.initEventListeners();
    this.resumeFocusTimerIfNeeded();
    this.navigate(this.state.activeTab, false);
    this.updateNotificationBadge();
    this.pingAI();
  }

  loadState() {
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (!stored) return JSON.parse(JSON.stringify(DEFAULT_STATE));
      const parsed = JSON.parse(stored);
      const merged = Object.assign({}, JSON.parse(JSON.stringify(DEFAULT_STATE)), parsed);
      merged.permissions = Object.assign({}, DEFAULT_STATE.permissions, parsed.permissions || {});
      merged.dashboardLayout = Object.assign({}, DEFAULT_STATE.dashboardLayout, parsed.dashboardLayout || {});
      if (!Array.isArray(merged.aiThreads) || !merged.aiThreads.length) {
        merged.aiThreads = JSON.parse(JSON.stringify(DEFAULT_STATE.aiThreads));
      }
      return merged;
    } catch (err) {
      return JSON.parse(JSON.stringify(DEFAULT_STATE));
    }
  }

  saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
      this.updateNotificationBadge();
      return true;
    } catch (err) {
      this.toast('Storage limit reached or blocked: ' + err.message, 'error');
      return false;
    }
  }

  // Custom Non-Blocking Confirmation Modal (Never uses native confirm() or alert())
  confirmAction(title, message, onConfirm, confirmText = 'Confirm', danger = true) {
    const root = document.getElementById('confirm-root');
    root.classList.remove('hidden');
    root.classList.add('flex');
    root.innerHTML = `
      <div class="custom-card p-6 rounded-2xl w-full max-w-md space-y-4 shadow-2xl border border-[var(--border-color)]">
        <h3 class="font-bold text-lg">${esc(title)}</h3>
        <p class="text-sm text-[var(--text-muted)] leading-relaxed">${esc(message)}</p>
        <div class="flex justify-end gap-3 pt-2">
          <button id="cfm-cancel" class="px-4 py-2 custom-card rounded-xl text-xs font-semibold hover:bg-[var(--bg-card-hover)]">Cancel</button>
          <button id="cfm-ok" class="px-4 py-2 ${danger ? 'bg-red-600 hover:bg-red-700' : 'bg-indigo-600 hover:bg-indigo-700'} text-white rounded-xl text-xs font-semibold">${esc(confirmText)}</button>
        </div>
      </div>
    `;
    const close = () => {
      root.classList.add('hidden');
      root.classList.remove('flex');
    };
    document.getElementById('cfm-cancel').onclick = close;
    document.getElementById('cfm-ok').onclick = () => {
      close();
      onConfirm();
    };
  }

  logChange(actionLabel, restoreFnData) {
    this.state.auditLog.unshift({
      id: 'log_' + Math.random().toString(36).slice(2, 9),
      at: Date.now(),
      label: actionLabel,
      restore: restoreFnData || null,
      undone: false
    });
    if (this.state.auditLog.length > 60) this.state.auditLog.length = 60;
  }

  toast(msg, type = 'info') {
    const container = document.getElementById('toast-container');
    if (!container) return;
    const el = document.createElement('div');
    const bg = type === 'error' ? 'bg-red-600 text-white' : type === 'success' ? 'bg-emerald-600 text-white' : 'bg-slate-900 text-white border border-slate-700';
    el.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-xl text-xs md:text-sm font-medium flex items-center justify-between gap-3 transition-all transform translate-y-2 opacity-0 ${bg}`;
    el.innerHTML = `<span>${esc(msg)}</span>`;
    container.appendChild(el);
    setTimeout(() => el.classList.remove('translate-y-2', 'opacity-0'), 10);
    setTimeout(() => {
      el.classList.add('translate-y-2', 'opacity-0');
      setTimeout(() => el.remove(), 300);
    }, 3500);
  }

  initTheme() {
    document.documentElement.setAttribute('data-theme', this.state.theme);
    document.documentElement.style.setProperty('--accent', this.state.accentColor);
    const ring = document.getElementById('orb-ring');
    if (ring) ring.style.animationPlayState = this.state.reducedMotion ? 'paused' : 'running';
  }

  setOrbState(mode) {
    this.aiStatus = mode;
    const core = document.getElementById('orb-core');
    const ring = document.getElementById('orb-ring');
    const dot = document.getElementById('ai-status-dot');
    const txt = document.getElementById('ai-status-text');
    if (!core || !ring) return;
    if (mode === 'connected') {
      ring.style.animationDuration = '8s';
      ring.style.opacity = '0.85';
      core.className = 'w-6 h-6 rounded-full bg-gradient-to-r from-blue-500 to-violet-500 shadow-[0_0_20px_rgba(65,105,225,0.95)] animate-pulse';
      if (dot) dot.className = 'w-2 h-2 rounded-full bg-emerald-500';
      if (txt) txt.textContent = 'VectoAI Connected';
    } else if (mode === 'thinking') {
      ring.style.animationDuration = '1.2s';
      ring.style.opacity = '1';
      core.className = 'w-7 h-7 rounded-full bg-gradient-to-r from-blue-300 via-white to-violet-400 shadow-[0_0_25px_rgba(129,140,248,1)] animate-ping';
      if (dot) dot.className = 'w-2 h-2 rounded-full bg-blue-400 animate-ping';
      if (txt) txt.textContent = 'VectoAI Thinking...';
    } else if (mode === 'error') {
      ring.style.opacity = '0.4';
      core.className = 'w-6 h-6 rounded-full bg-red-500 shadow-[0_0_15px_rgba(239,68,68,0.9)]';
      if (dot) dot.className = 'w-2 h-2 rounded-full bg-red-500';
      if (txt) txt.textContent = 'VectoAI Error';
    } else {
      ring.style.opacity = '0.25';
      core.className = 'w-6 h-6 rounded-full bg-slate-600';
      if (dot) dot.className = 'w-2 h-2 rounded-full bg-slate-500';
      if (txt) txt.textContent = 'VectoAI Offline';
    }
  }

  isLocalhostEndpoint() {
    try {
      const u = new URL(this.state.endpoint);
      return u.hostname === '127.0.0.1' || u.hostname === 'localhost';
    } catch (e) {
      return false;
    }
  }

  async pingAI() {
    if (!this.isLocalhostEndpoint()) {
      this.setOrbState('error');
      return 'Blocked: Endpoint must remain strictly on localhost (127.0.0.1)';
    }
    try {
      const res = await fetch(`${this.state.endpoint}/v1/models`, { signal: AbortSignal.timeout(3500) });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      this.setOrbState('connected');
      return 'Connected to local llama.cpp server';
    } catch (e) {
      this.setOrbState('offline');
      return 'Offline (Start llama-server on ' + this.state.endpoint + ' with --cors)';
    }
  }

  navigate(tabName, updateHistory = true) {
    this.state.activeTab = tabName;
    if (updateHistory) this.saveState();
    this.renderNavigation();
    this.renderContent();
  }

  renderNavigation() {
    const navEl = document.getElementById('nav-links');
    const sections = [
      { id: 'Home', icon: '🏠' },
      { id: 'Study', icon: '📚' },
      { id: 'Planner', icon: '📅' },
      { id: 'Creative', icon: '🎨' },
      { id: 'Projects', icon: '🚀' },
      { id: 'Progress', icon: '📊' },
      { id: 'VectoAI', icon: '✨' },
      { id: 'Settings', icon: '⚙️' }
    ];
    navEl.innerHTML = sections.map(sec => {
      const active = this.state.activeTab === sec.id;
      return `
        <button onclick="app.navigate('${sec.id}')" class="flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl font-medium text-xs md:text-sm whitespace-nowrap transition-all w-auto md:w-full ${
          active 
            ? 'bg-gradient-to-r from-blue-500 to-violet-500 text-slate-950 shadow-lg shadow-blue-500/40 font-semibold' 
            : 'text-[var(--text-muted)] hover:bg-[var(--bg-card-hover)] hover:text-[var(--text-main)]'
        }">
          <span>${sec.icon}</span>
          <span>${sec.id}</span>
          ${sec.id === 'VectoAI' && this.state.proposals.length ? `<span class="ml-auto bg-violet-500 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">${this.state.proposals.length}</span>` : ''}
        </button>
      `;
    }).join('');
  }

  renderContent() {
    const contentEl = document.getElementById('app-content');
    switch (this.state.activeTab) {
      case 'Home': contentEl.innerHTML = this.renderHome(); break;
      case 'Study': contentEl.innerHTML = this.renderStudy(); break;
      case 'Planner': contentEl.innerHTML = this.renderPlanner(); break;
      case 'Creative': contentEl.innerHTML = this.renderCreative(); this.hydrateCreativeImages(); break;
      case 'Projects': contentEl.innerHTML = this.renderProjects(); break;
      case 'Progress': contentEl.innerHTML = this.renderProgress(); break;
      case 'VectoAI': contentEl.innerHTML = this.renderVectoAI(); this.scrollToBottomChat(); break;
      case 'Settings': contentEl.innerHTML = this.renderSettings(); this.loadBackupsList(); break;
      default: contentEl.innerHTML = this.renderHome();
    }
  }

  initEventListeners() {
    document.getElementById('vecto-orb').onclick = () => this.navigate('VectoAI');
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        this.openGlobalSearch();
      } else if (e.altKey && /^[1-8]$/.test(e.key)) {
        e.preventDefault();
        const sections = ['Home', 'Study', 'Planner', 'Creative', 'Projects', 'Progress', 'VectoAI', 'Settings'];
        this.navigate(sections[parseInt(e.key) - 1]);
      } else if (e.key === 'Escape') {
        this.closeModal();
      }
    });
  }

  // ==================== GLOBAL FEATURES: SEARCH, QUICK ADD, NOTIFICATIONS ====================
  getNotifications() {
    if (!this.state.permissions.notifications) return [];
    const todayStr = new Date().toISOString().slice(0, 10);
    const items = [];
    this.state.tasks.filter(t => !t.done && (!t.rep || t.rep === 'none') && t.date && t.date < todayStr).forEach(t => {
      items.push({ kind: 'Overdue Task', title: t.title, date: t.date, target: 'Planner' });
    });
    this.state.chapters.filter(c => !c.archived && c.next && c.next <= todayStr).forEach(c => {
      items.push({ kind: 'Revision Due', title: c.name, date: c.next, target: 'Study' });
    });
    this.state.milestones.filter(m => !m.done && m.target && m.target <= todayStr).forEach(m => {
      items.push({ kind: 'Milestone Due', title: m.name, date: m.target, target: 'Projects' });
    });
    this.state.exams.filter(ex => ex.date >= todayStr).forEach(ex => {
      items.push({ kind: 'Upcoming Exam', title: ex.name, date: ex.date, target: 'Study' });
    });
    return items;
  }

  updateNotificationBadge() {
    const badge = document.getElementById('notif-badge');
    if (!badge) return;
    const list = this.getNotifications();
    if (list.length > 0) {
      badge.textContent = list.length;
      badge.classList.remove('hidden');
    } else {
      badge.classList.add('hidden');
    }
  }

  openNotificationsModal() {
    const list = this.getNotifications();
    const root = document.getElementById('modal-root');
    root.classList.remove('hidden');
    root.classList.add('flex');
    root.innerHTML = `
      <div class="custom-card p-6 rounded-2xl w-full max-w-lg space-y-4 max-h-[85vh] overflow-y-auto">
        <div class="flex items-center justify-between">
          <h3 class="font-bold text-lg">Reminders & Notifications (${list.length})</h3>
          <button onclick="app.closeModal()" class="text-xs text-[var(--text-muted)] hover:text-[var(--text-main)]">Close ✕</button>
        </div>
        <div class="divide-y divide-[var(--border-color)]">
          ${list.length === 0 ? '<div class="py-8 text-center text-sm text-[var(--text-muted)]">All caught up! No overdue tasks or pending revision alerts.</div>' :
            list.map(n => `
              <div class="py-3 flex items-center justify-between gap-3">
                <div>
                  <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-400">${esc(n.kind)}</span>
                  <div class="font-semibold text-sm mt-1">${esc(n.title)}</div>
                  <div class="text-xs text-[var(--text-muted)]">Scheduled: ${esc(n.date)}</div>
                </div>
                <button onclick="app.closeModal();app.navigate('${n.target}')" class="px-3 py-1.5 custom-card rounded-xl text-xs font-semibold hover:bg-[var(--bg-card-hover)]">Open →</button>
              </div>
            `).join('')
          }
        </div>
      </div>
    `;
  }

  openGlobalSearch() {
    const root = document.getElementById('modal-root');
    root.classList.remove('hidden');
    root.classList.add('flex');

  // ==================== SCHEDULE OCCURRENCE & CONFLICT ENGINE ====================
  getOccurrencesOnDate(dateStr) {
    const parts = dateStr.split('-').map(Number);
    const dt = new Date(parts[0], parts[1] - 1, parts[2]);
    const dow = dt.getDay();
    return this.state.tasks.filter(t => {
      if (t.status === 'Cancelled' || t.archived) return false;
      if (!t.rep || t.rep === 'none') return t.date === dateStr;
      if (!t.date || t.date > dateStr || (t.skip || []).includes(dateStr)) return false;
      if (t.rep === 'daily') return true;
      if (t.rep === 'weekdays') return dow >= 1 && dow <= 5;
      if (t.rep === 'weekly') {
        const op = t.date.split('-').map(Number);
        return new Date(op[0], op[1] - 1, op[2]).getDay() === dow;
      }
      if (t.rep === 'monthly') return t.date.slice(8, 10) === dateStr.slice(8, 10);
      return false;
    });
  }

  isTaskDoneOnDate(t, dateStr) {
    return t.rep && t.rep !== 'none' ? (t.doneOn || []).includes(dateStr) : !!t.done;
  }

  detectScheduleConflicts(dateStr) {
    const timed = this.getOccurrencesOnDate(dateStr).filter(t => t.start && t.dur > 0).map(t => {
      const [h, m] = t.start.split(':').map(Number);
      const sMin = h * 60 + m;
      return { t, sMin, eMin: sMin + Number(t.dur) };
    }).sort((a, b) => a.sMin - b.sMin);
    const conflicts = [];
    for (let i = 0; i < timed.length; i++) {
      for (let j = i + 1; j < timed.length; j++) {
        if (timed[i].sMin < timed[j].eMin && timed[j].sMin < timed[i].eMin) {
          conflicts.push(`"${timed[i].t.title}" (${timed[i].t.start}) overlaps with "${timed[j].t.title}" (${timed[j].t.start})`);
        }
      }
    }
    return conflicts;
  }

  generateDataDrivenInsights() {
    const list = [];
    const todayStr = new Date().toISOString().slice(0, 10);
    const pendingLecs = this.state.lectures.filter(l => !l.done);
    if (pendingLecs.length > 0) {
      list.push({
        id: 'ins_backlog',
        title: `${pendingLecs.length} Pending Lectures in Backlog`,
        reason: `Estimated ${Math.round(pendingLecs.reduce((a,l)=>a+(l.dur||0),0)/60*10)/10} hours of unwatched lectures across your subjects.`,
        priority: 'High',
        section: 'Study'
      });
    }
    const dueRevs = this.state.chapters.filter(c => !c.archived && c.next && c.next <= todayStr);
    if (dueRevs.length > 0) {
      list.push({
        id: 'ins_rev',
        title: `${dueRevs.length} Chapter Revision(s) Due`,
        reason: `"${dueRevs[0].name}" is scheduled for spaced revision.`,
        priority: 'Medium',
        section: 'Study'
      });
    }
    const conflicts = this.detectScheduleConflicts(todayStr);
    if (conflicts.length > 0) {
      list.push({
        id: 'ins_conflict',
        title: 'Schedule Overlap Detected Today',
        reason: conflicts[0],
        priority: 'High',
        section: 'Planner'
      });
    }
    return list.filter(i => !(this.state.dismissedInsights || []).includes(i.id)).slice(0, 3);
  }

  dismissInsight(id) {
    this.state.dismissedInsights = this.state.dismissedInsights || [];
    if (!this.state.dismissedInsights.includes(id)) this.state.dismissedInsights.push(id);
    this.saveState();
    this.renderContent();
  }

  moveTaskOrder(taskId, dir) {
    const idx = this.state.tasks.findIndex(t => t.id === taskId);
    if (idx < 0) return;
    const targetIdx = idx + dir;
    if (targetIdx < 0 || targetIdx >= this.state.tasks.length) return;
    const temp = this.state.tasks[idx];
    this.state.tasks[idx] = this.state.tasks[targetIdx];
    this.state.tasks[targetIdx] = temp;
    this.saveState();
    this.renderContent();
  }

  openDashboardCustomizeModal() {
    const L = this.state.dashboardLayout;
    const items = [
      ['showMetrics', 'Top Overview Metric Cards'],
      ['showFocus', 'Today\'s Priority Focus Queue'],
      ['showAIInsights', 'VectoAI Live Data Insights'],
      ['showAcademic', 'Academic Subject Progress Cards'],

      ['showCreative', 'Creative Studio Summary']

    const root = document.getElementById('modal-root');

        <div class="flex items-center justify-between">
          <h3 class="font-bold text-lg">Customize Home Command Center</h3>
          <button onclick="app.closeModal()" class="text-xs text-[var(--text-muted)]">Close ✕</button>
        </div>
        <div class="space-y-2">
          ${items.map(([k, label]) => `

  toggleTaskToday(id, dateStr) {
    const task = this.state.tasks.find(t => t.id === id);
    if (!task) return;
    if (task.depId) {
      const dep = this.state.tasks.find(x => x.id === task.depId);
      if (dep && !dep.done && !this.isTaskDoneOnDate(task, dateStr)) {
        this.toast(`Blocked: Complete prerequisite task "${dep.title}" first!`, 'error');
        return;
      }
    }
    if (task.rep && task.rep !== 'none') {
      task.doneOn = task.doneOn || [];
      if (task.doneOn.includes(dateStr)) task.doneOn = task.doneOn.filter(d => d !== dateStr);
      else task.doneOn.push(dateStr);
    } else {
      task.done = !task.done;
      task.status = task.done ? 'Completed' : 'Pending';
    }
    this.saveState();
    this.renderContent();
  }

          <div class="custom-card p-5 rounded-2xl">
            <div class="text-xs font-semibold text-[var(--text-muted)]">UPCOMING EXAMS</div>
            <div class="text-2xl font-bold mt-2">${this.state.exams.length}</div>
            <div class="text-xs text-[var(--text-muted)] mt-1">${this.state.exams[0] ? esc(this.state.exams[0].name) + ' (' + this.state.exams[0].date + ')' : 'None scheduled'}</div>

                <div class="w-full bg-[var(--border-color)] h-2 rounded-full overflow-hidden">

  addChapter(e) {
    e.preventDefault();
    const fd = new FormData(e.target);
    this.state.chapters.push({
      id: 'chap_' + Math.random().toString(36).slice(2, 9),
      sid: fd.get('sid'),
      name: fd.get('name').trim(),
      desc: '',
      status: 'Not started',
      difficulty: fd.get('difficulty') || 'Medium',
      priority: 'Medium',
      estHours: parseInt(fd.get('estHours')) || 8,
      revCount: 0,
      lastRev: '',
      next: new Date(Date.now() + 604800000).toISOString().slice(0, 10),
      confidence: 3,
      notes: '',
      targetDate: '',
      archived: false
    });
    this.saveState();
    this.renderContent();
    this.toast('Chapter added!', 'success');
  }

  updateChapterStatus(id, status) {
    const chap = this.state.chapters.find(c => c.id === id);
    if (chap) {
      const old = chap.status;
      chap.status = status;
      this.logChange(`Chapter "${chap.name}" status: ${old} → ${status}`);
      this.saveState();
      this.renderContent();
    }
  }

  }

  toggleLecture(id) {
    const lec = this.state.lectures.find(l => l.id === id);
    if (lec) {
      lec.done = !lec.done;
      lec.doneAt = lec.done ? new Date().toISOString().slice(0, 10) : '';
      this.saveState();
      this.renderContent();
    }
  }

  renderStudyBacklog() {
    const pendingLecs = this.state.lectures.filter(l => !l.done);
    const pendingChaps = this.state.chapters.filter(c => !c.archived && c.status !== 'Completed');
    const totalMin = pendingLecs.reduce((acc, l) => acc + (l.dur || 0), 0);

    return `
      <div class="space-y-6">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div class="custom-card p-5 rounded-2xl">
            <div class="text-xs font-semibold text-[var(--text-muted)]">PENDING LECTURES</div>
            <div class="text-3xl font-bold mt-2">${pendingLecs.length}</div>
            <div class="text-xs text-[var(--text-muted)] mt-1">${(totalMin/60).toFixed(1)} hrs total watch workload</div>
          </div>
          <div class="custom-card p-5 rounded-2xl">
            <div class="text-xs font-semibold text-[var(--text-muted)]">PENDING CHAPTERS</div>
            <div class="text-3xl font-bold mt-2">${pendingChaps.length}</div>
            <div class="text-xs text-[var(--text-muted)] mt-1">Est. ${pendingChaps.reduce((a,c)=>a+(c.estHours||8),0)} hrs study time</div>
          </div>
          <div class="custom-card p-5 rounded-2xl">
            <div class="text-xs font-semibold text-[var(--text-muted)]">COMPLETED LECTURES</div>
            <div class="text-3xl font-bold mt-2 text-emerald-400">${this.state.lectures.filter(l=>l.done).length}</div>
            <div class="text-xs text-[var(--text-muted)] mt-1">Cleared from backlog</div>
          </div>
        </div>

        <div class="custom-card p-6 rounded-2xl space-y-4">
          <h3 class="font-bold text-base">Convert Backlog Lectures to Planner Tasks (Duplicate-Protected)</h3>
          <div class="space-y-2">
            ${pendingLecs.length === 0 ? '<div class="text-sm text-[var(--text-muted)]">Zero pending lectures! Your lecture backlog is completely clear.</div>' :
              pendingLecs.map(l => {
                const alreadyPlanned = this.state.tasks.some(t => t.ref === `lec:${l.id}`);
                return `
                  <div class="p-3 rounded-xl bg-[var(--bg-main)] border border-[var(--border-color)] flex items-center justify-between">
                    <div>
                      <div class="font-semibold text-sm">${esc(l.title)}</div>
                      <div class="text-xs text-[var(--text-muted)]">${l.dur} mins duration</div>
                    </div>
                    ${alreadyPlanned ? '<span class="text-xs text-emerald-400 font-semibold">Already in Planner ✓</span>' :
                      `<button onclick="app.convertBacklogToTask('${l.id}')" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg">+ Send to Planner</button>`
                    }
                  </div>
                `;
              }).join('')}
          </div>
        </div>
      </div>
    `;
  }

  convertBacklogToTask(id) {
    const lec = this.state.lectures.find(l => l.id === id);
    if (!lec) return;
    if (this.state.tasks.some(t => t.ref === `lec:${lec.id}`)) {
      this.toast('This backlog item is already scheduled in Planner.', 'info');
      return;
    }
    this.state.tasks.push({
      id: 'task_' + Math.random().toString(36).slice(2, 9),
      title: `Backlog Lecture: ${lec.title}`,
      desc: 'Converted from Study Backlog',
      cat: 'Study',
      date: new Date().toISOString().slice(0, 10),
      start: '16:00',
      dur: lec.dur || 45,
      pri: 'High',
      status: 'Pending',
      rep: 'none',
      done: false,
      doneOn: [],
      skip: [],
      depId: '',
      sid: lec.sid || '',
      pid: '',
      goalId: '',
      ref: `lec:${lec.id}`
    });
    this.saveState();
    this.renderContent();
    this.toast('Backlog item scheduled into Planner!', 'success');
  }

  renderStudyRevision() {
    const todayStr = new Date().toISOString().slice(0, 10);
    return `
      <div class="custom-card p-6 rounded-2xl space-y-4">
        <div>
          <h3 class="font-bold text-lg">Spaced Revision & Confidence Manager</h3>
          <p class="text-xs text-[var(--text-muted)]">Revision dates never change automatically without your explicit action.</p>
        </div>
        <div class="divide-y divide-[var(--border-color)]">
          ${this.state.chapters.filter(c=>!c.archived).map(c => {
            const isDue = c.next && c.next <= todayStr;
            return `
              <div class="py-4 flex flex-col md:flex-row md:items-center justify-between gap-3">
                <div>
                  <div class="font-semibold text-sm flex items-center gap-2">
                    <span>${esc(c.name)}</span>
                    ${isDue ? '<span class="text-[10px] px-2 py-0.5 rounded bg-violet-500/20 text-violet-400 font-bold">DUE FOR REVISION</span>' : ''}
                  </div>
                  <div class="text-xs text-[var(--text-muted)]">Last Revised: ${c.lastRev || 'Never'} · Revisions: ${c.revCount || 0} · Confidence: ${c.confidence || 3}/5</div>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                  <select onchange="app.updateChapterConfidence('${c.id}', this.value)" class="bg-[var(--bg-main)] border border-[var(--border-color)] rounded-lg px-2 py-1 text-xs">
                    ${[1,2,3,4,5].map(n => `<option value="${n}" ${(c.confidence||3)===n?'selected':''}>Conf: ${n}/5</option>`).join('')}
                  </select>
                  <input type="date" value="${c.next || ''}" onchange="app.updateChapterNextRev('${c.id}', this.value)" class="bg-[var(--bg-main)] border border-[var(--border-color)] rounded-lg px-2 py-1 text-xs">
                  <button onclick="app.logChapterRevision('${c.id}')" class="px-3 py-1.5 bg-indigo-600 text-white text-xs font-semibold rounded-lg">Log Revision</button>
                  <button onclick="app.pushRevision('${c.id}')" class="px-3 py-1.5 custom-card text-xs font-semibold rounded-lg">+ Planner</button>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }

  updateChapterConfidence(id, val) {
    const c = this.state.chapters.find(x => x.id === id);
    if (c) { c.confidence = parseInt(val); this.saveState(); }
  }

  updateChapterNextRev(id, dateStr) {
    const c = this.state.chapters.find(x => x.id === id);
    if (c) { c.next = dateStr; this.saveState(); this.renderContent(); this.toast('Next revision date updated.', 'info'); }
  }

  logChapterRevision(id) {
    const c = this.state.chapters.find(x => x.id === id);
    if (c) {
      c.revCount = (c.revCount || 0) + 1;
      c.lastRev = new Date().toISOString().slice(0, 10);
      this.saveState();
      this.renderContent();
      this.toast(`Logged revision #${c.revCount} for ${c.name}`, 'success');
    }
  }

  pushRevision(id) {
    const c = this.state.chapters.find(item => item.id === id);
    if (!c) return;
    this.state.tasks.push({
      id: 'task_' + Math.random().toString(36).slice(2, 9),
      title: `Revise Chapter: ${c.name}`,
      desc: 'Scheduled from Revision Manager',
      cat: 'Revision',
      date: c.next || new Date().toISOString().slice(0, 10),
      start: '18:00',
      dur: 45,
      pri: 'Medium',
      status: 'Pending',
      rep: 'none',
      done: false,
      doneOn: [],
      skip: [],
      depId: '',
      sid: c.sid,
      pid: '',
      goalId: '',
      ref: `rev:${c.id}`
    });
    this.saveState();
    this.toast('Revision session added to Planner!', 'success');
  }

    const todayStr = new Date().toISOString().slice(0, 10);
    return `
      <div class="space-y-6">
        <form onsubmit="app.addPracticeSession(event)" class="custom-card p-4 rounded-2xl grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-3 items-center">

                  </div>
                  <button onclick="app.deleteRecord('practiceSessions', '${p.id}')" class="text-xs text-red-400 font-semibold">Trash</button>
                </div>

  addPracticeSession(e) {
    e.preventDefault();
    const fd = new FormData(e.target);
    const att = parseInt(fd.get('attempted')) || 0;
    const cor = parseInt(fd.get('correct')) || 0;
    if (cor > att) {
      this.toast('Correct answers cannot exceed attempted questions!', 'error');
      return;
    }
    const chap = this.state.chapters.find(c => c.id === fd.get('cid'));
    this.state.practiceSessions.unshift({
      id: 'prac_' + Math.random().toString(36).slice(2, 9),
      sid: chap ? chap.sid : '',
      cid: fd.get('cid'),
      date: fd.get('date'),
      attempted: att,
      correct: cor,
      difficulty: 'Medium',
      obs: fd.get('obs').trim()
    });
    this.saveState();
    this.renderContent();
    this.toast('Practice session recorded!', 'success');
  }

    return `
      <div class="space-y-6">
        <form onsubmit="app.addTest(event)" class="custom-card p-4 rounded-2xl grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-3 items-center">

          ${this.state.tests.length === 0 ? '<div class="p-6 text-center text-[var(--text-muted)]">No test records yet.</div>' :

              const sub = this.state.subjects.find(s => s.id === t.sid);

              return `
                <div class="p-4 flex items-center justify-between">
                  <div>
                    <div class="font-semibold text-sm">${esc(t.name)}</div>

                  </div>
                  <div class="flex items-center gap-4">
                    <div class="text-right">
                      <div class="font-bold text-lg text-indigo-400">${pct}%</div>
                      <div class="text-xs text-[var(--text-muted)]">${t.got} / ${t.max}</div>
                    </div>
                    <button onclick="app.deleteRecord('tests', '${t.id}')" class="text-xs text-red-400 font-semibold">Trash</button>
                  </div>
                </div>
              `;
            }).join('')}
        </div>
      </div>
    `;
  }

  addTest(e) {
    e.preventDefault();
    const fd = new FormData(e.target);
    const max = parseFloat(fd.get('max'));
    const got = parseFloat(fd.get('got'));
    if (!(max > 0) || got < 0 || got > max) {
      this.toast('Obtained marks must be between 0 and Max Marks.', 'error');
      return;
    }
    this.state.tests.unshift({
      id: 'test_' + Math.random().toString(36).slice(2, 9),
      name: fd.get('name').trim(),
      date: fd.get('date'),
      sid: fd.get('sid'),
      max,
      got,
      type: 'Mock',
      obs: ''
    });
    this.saveState();
    this.renderContent();
    this.toast('Test score logged!', 'success');
  }

    }

  // Soft Trash Deletion with Cascade Record Preservation
  deleteRecord(coll, id) {
    const target = (this.state[coll] || []).find(item => item.id === id);
    if (!target) return;
    this.confirmAction(
      'Move Record to Trash',
      `Are you sure you want to move "${target.title || target.name || 'this item'}" to Trash? You can restore it anytime from Settings → Trash.`,
      () => {
        this.state[coll] = this.state[coll].filter(item => item.id !== id);
        this.state.trash.unshift({
          tid: 'tr_' + Math.random().toString(36).slice(2, 9),
          coll,
          record: target,
          deletedAt: Date.now()
        });
        this.saveState();
        this.renderContent();
        this.toast('Moved to Trash. Restore anytime in Settings.', 'info');
      },
      'Move to Trash'
    );
  }

  shiftCalendarDate(days) {
    const parts = this.calendarDate.split('-').map(Number);

    this.calendarDate = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    this.renderContent();
  }

          <input type="text" name="title" placeholder="Activity / task title..." required class="lg:col-span-2 bg-[var(--bg-main)] border border-[var(--border-color)] rounded-xl px-3 py-2 text-xs outline-none">

  // Persistent Focus Timer across Tab Switching & Reloads
  loadFocusRuntime() {
    try { return JSON.parse(localStorage.getItem('vectoplan_focus_rt')) || null; } catch (e) { return null; }
  }

  saveFocusRuntime() {
    try { localStorage.setItem('vectoplan_focus_rt', JSON.stringify(this.focusRuntime)); } catch (e) {}
  }

  resumeFocusTimerIfNeeded() {
    if (this.timerInterval) clearInterval(this.timerInterval);
    this.timerInterval = setInterval(() => {
      if (!this.focusRuntime || this.focusRuntime.status !== 'running') return;
      const remMs = Math.max(0, this.focusRuntime.endAt - Date.now());
      const disp = document.getElementById('timer-display');
      if (disp) disp.textContent = this.formatRemainingMs(remMs);

      const totalMs = Math.max(1000, (this.focusRuntime.planned || 25) * 60000);
      const elapsedMs = Math.max(0, totalMs - remMs);
      const pct = Math.min(100, Math.max(0, (elapsedMs / totalMs) * 100));

      const ringEl = document.getElementById('hud-timer-progress');
      if (ringEl) {
        const circum = 678.58; // 2 * Math.PI * 108
        ringEl.style.strokeDashoffset = (circum * (1 - pct / 100)).toFixed(2);
      }
      const pctEl = document.getElementById('hud-timer-pct');
      if (pctEl) pctEl.textContent = `${Math.round(pct)}% SYNC`;
      const ratioEl = document.getElementById('hud-timer-ratio');
      if (ratioEl) ratioEl.textContent = `${Math.floor(elapsedMs / 60000)}:${this.focusRuntime.planned || 25}M`;

      if (remMs <= 0) this.completeFocusSession(true);
    }, 1000);
  }

  formatRemainingMs(ms) {
    const totSec = Math.ceil(ms / 1000);
    return String(Math.floor(totSec / 60)).padStart(2, '0') + ':' + String(totSec % 60).padStart(2, '0');
  }

  renderPlannerFocus() {
    const rt = this.focusRuntime;
    const plannedMins = rt ? (rt.planned || 25) : 25;
    const totalMs = Math.max(1000, plannedMins * 60000);
    const remMs = rt ? (rt.status === 'running' ? Math.max(0, rt.endAt - Date.now()) : rt.remainingMs) : totalMs;
    const elapsedMs = rt ? Math.max(0, totalMs - remMs) : 0;
    const pct = rt ? Math.min(100, Math.max(0, (elapsedMs / totalMs) * 100)) : 0;
    const circum = 678.58; // 2 * Math.PI * 108
    const dashOffset = (circum * (1 - pct / 100)).toFixed(2);

    const todayStr = new Date().toISOString().slice(0, 10);
    const todayMins = Math.round(this.state.focusSessions.filter(f => f.date === todayStr && f.kind === 'Study').reduce((a, f) => a + f.secs, 0) / 60);
    const isRunning = rt && rt.status === 'running';
    const isBreak = rt && rt.kind === 'Break';

    // Generate 72 precision radial tick marks for denser HUD dial
    const radialTicks = Array.from({ length: 72 }, (_, i) => {
      const deg = i * 5;
      const major = i % 6 === 0;
      return `<line x1="150" y1="${major ? 10 : 16}" x2="150" y2="${major ? 24 : 21}" stroke="${major ? '#8b5cf6' : 'rgba(34,211,238,0.35)'}" stroke-width="${major ? '2.2' : '1'}" transform="rotate(${deg} 150 150)" />`;
    }).join('');

    // Animated equalizer bars for live telemetry look
    const eqBars = Array.from({ length: 12 }, (_, i) => {
      const h = 8 + Math.sin(i * 0.9) * 10 + (i % 3) * 4;

  startTimer(mins, kind = 'Study') {
    const subjEl = document.getElementById('foc-subject');
    const subject = subjEl ? subjEl.value : 'Physics';
    const now = Date.now();
    this.focusRuntime = {
      status: 'running',
      kind,
      subject,
      planned: mins,
      startedSegmentAt: now,
      endAt: now + mins * 60000,
      remainingMs: mins * 60000,
      accumulatedMs: 0
    };
    this.saveFocusRuntime();
    this.renderContent();
  }

  pauseTimer() {
    if (!this.focusRuntime || this.focusRuntime.status !== 'running') return;
    const now = Date.now();
    this.focusRuntime.accumulatedMs += (now - this.focusRuntime.startedSegmentAt);
    this.focusRuntime.remainingMs = Math.max(0, this.focusRuntime.endAt - now);
    this.focusRuntime.status = 'paused';
    this.saveFocusRuntime();
    this.renderContent();
  }

  resumeTimer() {
    if (!this.focusRuntime || this.focusRuntime.status !== 'paused') return;
    const now = Date.now();
    this.focusRuntime.startedSegmentAt = now;
    this.focusRuntime.endAt = now + this.focusRuntime.remainingMs;
    this.focusRuntime.status = 'running';
    this.saveFocusRuntime();
    this.renderContent();
  }

  completeFocusSession(finishedNaturally) {
    if (!this.focusRuntime) return;
    const now = Date.now();
    if (this.focusRuntime.status === 'running') {
      this.focusRuntime.accumulatedMs += ((finishedNaturally ? this.focusRuntime.endAt : now) - this.focusRuntime.startedSegmentAt);
    }
    const secs = Math.max(60, Math.round(this.focusRuntime.accumulatedMs / 1000));
    this.state.focusSessions.unshift({
      id: 'foc_' + Math.random().toString(36).slice(2, 9),
      kind: this.focusRuntime.kind,
      subject: this.focusRuntime.subject,
      date: new Date().toISOString().slice(0, 10),
      secs,
      planned: this.focusRuntime.planned
    });
    this.focusRuntime = null;
    this.saveFocusRuntime();
    this.saveState();
    this.renderContent();
    this.toast(`Focus session logged (${Math.round(secs / 60)} min)!`, 'success');
  }

  renderPlannerHabits() {
    const last7 = Array.from({ length: 7 }, (_, i) => {
      const d = new Date(Date.now() - (6 - i) * 86400000);
      return d.toISOString().slice(0, 10);

    return `

        <form onsubmit="app.addHabit(event)" class="custom-card p-4 rounded-2xl flex gap-3 items-center">
          <input type="text" name="name" placeholder="New habit (e.g. Daily NCERT Reading)" required class="bg-[var(--bg-main)] border border-[var(--border-color)] rounded-xl px-3 py-2 text-sm flex-1 outline-none">
          <button type="submit" class="px-4 py-2 bg-indigo-600 text-white text-sm font-semibold rounded-xl">+ Add Habit</button>

              </div>

                ${last7.map(d => {
                  const on = (h.days || []).includes(d);

                }).join('')}

      </div>
    `;

  addHabit(e) {
    e.preventDefault();
    const fd = new FormData(e.target);
    this.state.habits.push({ id: 'hab_' + Math.random().toString(36).slice(2, 9), name: fd.get('name').trim(), days: [] });

    this.renderContent();
    this.toast('Habit created!', 'success');

  toggleHabitToday(id, dateStr) {
    const h = this.state.habits.find(item => item.id === id);
    if (!h) return;
    h.days = h.days || [];
    if (h.days.includes(dateStr)) h.days = h.days.filter(d => d !== dateStr);
    else h.days.push(dateStr);
    this.saveState();
    this.renderContent();
  }

  renderPlannerTemplates() {
    return `

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

  // ==================== 4. CREATIVE MODULE (CREATIVE STUDIO & PORTFOLIO) ====================
  getCreativeMediums() {
    const set = new Set(this.state.creativeMediums || ['Acrylic', 'Sketch', 'Watercolor']);
    (this.state.artworks || []).forEach(a => { if (a.medium) set.add(a.medium); });
    (this.state.creativePractice || []).forEach(cp => { if (cp.medium) set.add(cp.medium); });
    return Array.from(set);
  }

  addCustomMedium(e) {
    e.preventDefault();
    const fd = new FormData(e.target);
    const m = (fd.get('medium') || '').trim();
    if (!m) return;
    this.state.creativeMediums = this.getCreativeMediums();
    if (!this.state.creativeMediums.includes(m)) {
      this.state.creativeMediums.push(m);
      this.saveState();
      this.renderContent();
      this.toast(`Added creative medium: ${m}`, 'success');
    }
  }

  renderCreative() {
    const subTab = this.state.subTab['Creative'] || 'Gallery';
    const mediums = this.getCreativeMediums();
    const tabs = ['Gallery', ...mediums, 'Practice'];
    const f = this.creativeFilter;
    const medFilter = mediums.includes(subTab) ? subTab : f.medium;

    const list = this.state.artworks.filter(a => (!medFilter || a.medium === medFilter) && (!f.status || a.status === f.status) && (!f.q || (a.title + ' ' + (a.tags || '')).toLowerCase().includes(f.q.toLowerCase())));

    return `

  async hydrateCreativeImages() {
    const containers = document.querySelectorAll('.art-thumb-container');
    for (const el of containers) {
      const imgId = el.dataset.imgid;

        el.innerHTML = '<span class="text-xs text-[var(--text-muted)]">No reference file attached</span>';
        continue;
      }
      const fileRec = await getFileFromIDB(imgId);
      if (!fileRec) {
        el.innerHTML = '<span class="text-xs text-red-400">File missing in IndexedDB</span>';
        continue;
      }
      if (fileRec.type.startsWith('image/')) {
        const url = URL.createObjectURL(fileRec.blob);
        // Strictly preserve original aspect ratio without cropping (object-contain)
        el.innerHTML = `<img src="${url}" alt="Artwork" class="max-w-full max-h-full object-contain rounded-lg">`;
      } else {
        el.innerHTML = `<div class="text-xs font-semibold text-indigo-400">📄 PDF Reference (${esc(fileRec.name)})</div>`;
      }
    }
  }

  async exportArtwork(artId, fmt) {
    const art = this.state.artworks.find(a => a.id === artId);
    if (!art || !art.imgId) return;
    try {
      const rec = await getFileFromIDB(art.imgId);
      if (!rec) throw new Error('File not found in IndexedDB');
      const safeName = (art.title || 'artwork').replace(/[^\w\-]+/g, '_');
      if (rec.type === 'application/pdf') {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(rec.blob);
        a.download = safeName + '.pdf';
        a.click();
        return;
      }
      const bmp = await createImageBitmap(rec.blob);
      const canvas = document.createElement('canvas');
      canvas.width = bmp.width;
      canvas.height = bmp.height;
      const ctx = canvas.getContext('2d');
      if (fmt !== 'png') {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
      ctx.drawImage(bmp, 0, 0);
      const outBlob = await new Promise(r => canvas.toBlob(r, fmt === 'png' ? 'image/png' : 'image/jpeg', 0.95));
      if (fmt === 'pdf') {
        const jpgBytes = new Uint8Array(await outBlob.arrayBuffer());
        const pdfBlob = createSinglePageImagePDF(jpgBytes, canvas.width, canvas.height);
        const a = document.createElement('a');
        a.href = URL.createObjectURL(pdfBlob);
        a.download = safeName + '.pdf';
        a.click();
      } else {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(outBlob);
        a.download = `${safeName}.${fmt}`;
        a.click();
      }
      this.toast(`Exported ${art.title} as ${fmt.toUpperCase()}!`, 'success');
    } catch (e) {
      this.toast('Export failed: ' + e.message, 'error');
    }
  }

  logPhoneUsage(e) {
    e.preventDefault();

    const topApp = (fd.get('topApp') || '').trim();
    const notes = (fd.get('notes') || '').trim();
    if (!date || isNaN(mins) || mins < 0) return;

    this.state.phoneUsage = this.state.phoneUsage || [];
    const existing = this.state.phoneUsage.find(p => p.date === date);
    if (existing) {
      existing.mins = mins;
      if (pickups) existing.pickups = pickups;
      if (topApp) existing.topApp = topApp;
      if (notes) existing.notes = notes;
    } else {
      this.state.phoneUsage.push({
        id: 'ph_' + Math.random().toString(36).slice(2, 9),
        date,
        mins,
        pickups,
        topApp,
        notes

    this.state.phoneUsage.sort((a, b) => a.date < b.date ? -1 : 1);

  getLastNDates(n, endDateStr) {
    const endParts = (endDateStr || new Date().toISOString().slice(0, 10)).split('-').map(Number);
    const endObj = new Date(endParts[0], endParts[1] - 1, endParts[2]);
    const out = [];
    for (let i = n - 1; i >= 0; i--) {
      const d = new Date(endObj.getFullYear(), endObj.getMonth(), endObj.getDate() - i);
      out.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'));
    }
    return out;
  }

  getFilteredDateList() {
    const af = this.analyticsFilter;
    const todayStr = new Date().toISOString().slice(0, 10);
    if (af.period === '7d') return this.getLastNDates(7, todayStr);
    if (af.period === '14d') return this.getLastNDates(14, todayStr);
    if (af.period === '30d') return this.getLastNDates(30, todayStr);
    if (af.period === '90d') return this.getLastNDates(90, todayStr);
    if (af.period === '365d') return this.getLastNDates(365, todayStr);
    if (af.period === 'custom' && af.from && af.to && af.from <= af.to) {
      const list = [];
      const [y1, m1, d1] = af.from.split('-').map(Number);
      const [y2, m2, d2] = af.to.split('-').map(Number);
      let cur = new Date(y1, m1 - 1, d1);
      const end = new Date(y2, m2 - 1, d2);
      while (cur <= end && list.length < 366) {
        list.push(cur.getFullYear() + '-' + String(cur.getMonth() + 1).padStart(2, '0') + '-' + String(cur.getDate()).padStart(2, '0'));
        cur.setDate(cur.getDate() + 1);
      }
      return list.length ? list : this.getLastNDates(14, todayStr);
    }
    return this.getLastNDates(14, todayStr);
  }

  // Export any SVG Chart to PNG or JPG
  async exportChartImage(svgId, title, fmt = 'png') {
    const svgEl = document.getElementById(svgId);
    if (!svgEl) {
      this.toast('Chart element not found for export.', 'error');
      return;
    }
    try {
      const clone = svgEl.cloneNode(true);
      clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      const box = svgEl.viewBox?.baseVal;
      const w = (box && box.width) ? box.width * 2 : 1200;
      const h = (box && box.height) ? box.height * 2 : 600;
      const rawSvg = new XMLSerializer().serializeToString(clone);
      const blob = new Blob([rawSvg], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const img = new Image();
      await new Promise((res, rej) => {
        img.onload = res;
        img.onerror = rej;
        img.src = url;
      });
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = this.state.theme === 'light' ? '#ffffff' : '#0f172a';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      const outBlob = await new Promise(r => canvas.toBlob(r, fmt === 'png' ? 'image/png' : 'image/jpeg', 0.95));
      const a = document.createElement('a');
      a.href = URL.createObjectURL(outBlob);
      a.download = `${(title || 'vectoplan_chart').replace(/[^\w\-]+/g, '_')}.${fmt}`;
      a.click();
      this.toast(`Chart exported as ${fmt.toUpperCase()}!`, 'success');
    } catch (err) {
      this.toast('Chart export failed: ' + err.message, 'error');
    }
  }

  // Compute Period-over-Period Comparison
  computePeriodComparison(dates) {
    const n = dates.length;
    const firstDate = dates[0];
    const [y, m, d] = firstDate.split('-').map(Number);
    const prevEnd = new Date(y, m - 1, d - 1);
    const prevEndStr = prevEnd.getFullYear() + '-' + String(prevEnd.getMonth() + 1).padStart(2, '0') + '-' + String(prevEnd.getDate()).padStart(2, '0');
    const prevDates = this.getLastNDates(n, prevEndStr);

    const sumStudy = (arr) => Math.round(this.state.focusSessions.filter(f => arr.includes(f.date) && f.kind === 'Study').reduce((a, f) => a + f.secs, 0) / 60);
    const sumPhone = (arr) => (this.state.phoneUsage || []).filter(p => arr.includes(p.date)).reduce((a, p) => a + (p.mins || 0), 0);
    const sumTasks = (arr) => {
      let done = 0, tot = 0;
      arr.forEach(dt => {
        const occs = this.getOccurrencesOnDate(dt);
        tot += occs.length;
        done += occs.filter(t => this.isTaskDoneOnDate(t, dt)).length;
      });
      return { done, tot, rate: tot ? Math.round((done / tot) * 100) : 0 };
    };

    return {
      currStudy: sumStudy(dates),
      prevStudy: sumStudy(prevDates),
      currPhone: sumPhone(dates),
      prevPhone: sumPhone(prevDates),
      currTasks: sumTasks(dates),
      prevTasks: sumTasks(prevDates)
    };
  }

  renderStudyVsPhoneLineSVG(svgId, dates) {
    const W = 560, H = 220, padL = 42, padR = 20, padT = 20, padB = 34;
    const plotW = W - padL - padR, plotH = H - padT - padB;
    const studyVals = dates.map(d => Math.round(this.state.focusSessions.filter(f => f.date === d && f.kind === 'Study').reduce((a, f) => a + f.secs, 0) / 60));
    const phoneVals = dates.map(d => (this.state.phoneUsage || []).filter(p => p.date === d).reduce((a, p) => a + (p.mins || 0), 0));
    const maxY = Math.max(60, ...studyVals, ...phoneVals);

    const ptX = (i) => padL + (dates.length > 1 ? (i / (dates.length - 1)) * plotW : plotW / 2);
    const ptY = (v) => padT + plotH - (v / maxY) * plotH;

    const studyPath = studyVals.map((v, i) => `${i === 0 ? 'M' : 'L'}${ptX(i).toFixed(1)},${ptY(v).toFixed(1)}`).join(' ');
    const phonePath = phoneVals.map((v, i) => `${i === 0 ? 'M' : 'L'}${ptX(i).toFixed(1)},${ptY(v).toFixed(1)}`).join(' ');

    return `
      <svg id="${svgId}" viewBox="0 0 ${W} ${H}" class="w-full h-56 overflow-visible">
        ${[0, 0.5, 1].map(fr => {
          const y = padT + plotH * (1 - fr);
          const val = Math.round(maxY * fr);
          return `
            <line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="var(--border-color)" stroke-dasharray="3 3" />
            <text x="${padL - 6}" y="${y + 4}" text-anchor="end" fill="var(--text-muted)" font-size="10">${val}m</text>
          `;
        }).join('')}
        <path d="${studyPath}" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" />
        <path d="${phonePath}" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="5 3" stroke-linecap="round" />
        ${dates.map((d, i) => `
          <g class="cursor-pointer" onclick="app.inspectDateRecords('${d}')">
            <circle cx="${ptX(i)}" cy="${ptY(studyVals[i])}" r="4" fill="#6366f1"><title>${d} Study: ${studyVals[i]} min</title></circle>
            <circle cx="${ptX(i)}" cy="${ptY(phoneVals[i])}" r="4" fill="#f43f5e"><title>${d} Phone: ${phoneVals[i]} min</title></circle>
            ${i % Math.max(1, Math.floor(dates.length / 7)) === 0 ? `<text x="${ptX(i)}" y="${H - 10}" text-anchor="middle" fill="var(--text-muted)" font-size="9">${d.slice(5)}</text>` : ''}
          </g>
        `).join('')}
      </svg>
      <div class="flex items-center justify-center gap-6 text-xs text-[var(--text-muted)] pt-2">
        <span class="flex items-center gap-1.5"><i class="w-3 h-1 bg-indigo-500 inline-block rounded"></i> Actual Study Time (mins)</span>
        <span class="flex items-center gap-1.5"><i class="w-3 h-1 bg-rose-500 inline-block rounded"></i> Phone Screen Time (mins)</span>
      </div>
    `;
  }

  renderMultiAreaRadarSVG(svgId) {
    const chaps = this.state.chapters.filter(c => !c.archived);
    const syllabusScore = chaps.length ? Math.round((chaps.filter(c => c.status === 'Completed').length / chaps.length) * 100) : 0;
    const lecs = this.state.lectures;
    const lectureScore = lecs.length ? Math.round((lecs.filter(l => l.done).length / lecs.length) * 100) : 0;
    const att = this.state.practiceSessions.reduce((a, p) => a + (p.attempted || 0), 0);
    const cor = this.state.practiceSessions.reduce((a, p) => a + (p.correct || 0), 0);
    const practiceScore = att ? Math.round((cor / att) * 100) : 0;
    const tasks = this.state.tasks.filter(t => !t.rep || t.rep === 'none');
    const taskScore = tasks.length ? Math.round((tasks.filter(t => t.done).length / tasks.length) * 100) : 0;
    const projs = this.state.projects;
    const projScore = projs.length ? Math.round(projs.reduce((a, p) => a + this.getProjectProgress(p).pct, 0) / projs.length) : 0;
    const goals = this.state.goals;
    const goalScore = goals.length ? Math.round((goals.filter(g => g.done).length / goals.length) * 100) : 0;

    const axes = [
      { label: 'Syllabus', val: syllabusScore },
      { label: 'Lectures', val: lectureScore },
      { label: 'Accuracy', val: practiceScore },
      { label: 'Tasks', val: taskScore },
      { label: 'Projects', val: projScore },
      { label: 'Goals', val: goalScore }
    ];
    const cx = 200, cy = 110, R = 78;
    const pt = (idx, pct) => {
      const ang = -Math.PI / 2 + (idx * 2 * Math.PI) / axes.length;
      const r = (pct / 100) * R;
      return [cx + r * Math.cos(ang), cy + r * Math.sin(ang)];
    };
    const polyPts = axes.map((a, i) => pt(i, a.val).map(n => n.toFixed(1)).join(',')).join(' ');

    return `
      <svg id="${svgId}" viewBox="0 0 400 220" class="w-full h-56">
        ${[25, 50, 75, 100].map(level => {
          const ringPts = axes.map((_, i) => pt(i, level).map(n => n.toFixed(1)).join(',')).join(' ');
          return `<polygon points="${ringPts}" fill="none" stroke="var(--border-color)" stroke-width="1" />`;
        }).join('')}
        ${axes.map((a, i) => {
          const [ex, ey] = pt(i, 100);
          const [lx, ly] = pt(i, 122);
          return `
            <line x1="${cx}" y1="${cy}" x2="${ex}" y2="${ey}" stroke="var(--border-color)" />
            <text x="${lx}" y="${ly + 3}" text-anchor="middle" fill="var(--text-muted)" font-size="10">${a.label} (${a.val}%)</text>
          `;
        }).join('')}
        <polygon points="${polyPts}" fill="rgba(99, 102, 241, 0.28)" stroke="#6366f1" stroke-width="2" />
        ${axes.map((a, i) => {
          const [px, py] = pt(i, a.val);
          return `<circle cx="${px}" cy="${py}" r="4" fill="#6366f1"><title>${a.label}: ${a.val}%</title></circle>`;
        }).join('')}
      </svg>
    `;
  }

  renderConsistencyHeatmapSVG(svgId) {
    const days = this.getLastNDates(28);
    return `
      <svg id="${svgId}" viewBox="0 0 700 95" class="w-full h-24">
        ${days.map((d, idx) => {
          const col = idx % 14;
          const row = Math.floor(idx / 14);
          const x = 10 + col * 49;
          const y = 10 + row * 38;
          const studyM = Math.round(this.state.focusSessions.filter(f => f.date === d && f.kind === 'Study').reduce((a, f) => a + f.secs, 0) / 60);
          const doneT = this.getOccurrencesOnDate(d).filter(t => this.isTaskDoneOnDate(t, d)).length;
          const score = studyM + doneT * 20;
          const fill = score === 0 ? 'var(--bg-main)' : score < 45 ? '#312e81' : score < 90 ? '#4338ca' : score < 150 ? '#4f46e5' : '#6366f1';
          return `
            <g class="cursor-pointer" onclick="app.inspectDateRecords('${d}')">
              <rect x="${x}" y="${y}" width="42" height="30" rx="6" fill="${fill}" stroke="var(--border-color)" />
              <text x="${x + 21}" y="${y + 14}" text-anchor="middle" fill="#e2e8f0" font-size="8">${d.slice(5)}</text>
              <text x="${x + 21}" y="${y + 24}" text-anchor="middle" fill="#a5b4fc" font-size="8">${studyM}m</text>
              <title>${d}: ${studyM}m study, ${doneT} tasks completed</title>
            </g>
          `;
        }).join('')}
      </svg>

  renderDonutChartSVG(svgId, slices, centerLabel) {
    const total = slices.reduce((a, s) => a + (s.value || 0), 0);
    if (total <= 0) {
      return `<div id="${svgId}" class="py-12 text-center text-xs text-[var(--text-muted)]">More recorded data is needed to render this proportional chart.</div>`;
    }
    const cx = 130, cy = 105, r = 68, strokeW = 24;
    const circum = 2 * Math.PI * r;
    let accum = 0;

    return `
      <svg id="${svgId}" viewBox="0 0 460 210" class="w-full h-52">
        ${slices.map(s => {
          const frac = (s.value || 0) / total;
          const dash = frac * circum;
          const offset = -accum * circum;
          accum += frac;
          return `
            <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${strokeW}"
              stroke-dasharray="${dash.toFixed(2)} ${(circum - dash).toFixed(2)}"
              stroke-dashoffset="${offset.toFixed(2)}" transform="rotate(-90 ${cx} ${cy})">
              <title>${esc(s.label)}: ${s.value} (${Math.round(frac * 100)}%)</title>
            </circle>
          `;
        }).join('')}
        <text x="${cx}" y="${cy + 4}" text-anchor="middle" fill="var(--text-main)" font-size="13" font-weight="bold">${esc(centerLabel)}</text>
        ${slices.map((s, i) => `
          <g transform="translate(245, ${32 + i * 28})">
            <rect x="0" y="0" width="12" height="12" rx="3" fill="${s.color}" />
            <text x="20" y="10" fill="var(--text-main)" font-size="11">${esc(s.label)}: ${s.value} (${Math.round((s.value / total) * 100)}%)</text>
          </g>
        `).join('')}
      </svg>
    `;
  }
